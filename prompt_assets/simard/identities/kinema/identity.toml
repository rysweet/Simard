# Kinema identity card — pluggable Simard identity for 2D/3D animation &
# motion graphics. Loadable via FileIdentityLoader by pointing
# SIMARD_IDENTITY_PATH at this directory and selecting `simard-kinema`.
#
# The `simard-kinema` identity is also compiled into BuiltinIdentityLoader so it
# is selectable out of the box; this card is the pluggable, file-based
# equivalent for operators who deploy their own identity roster. It must stay in
# parity with the builtin definition in `src/identity/loader.rs`.

[package]
name = "simard-kinema"
version = "0.1.0"
description = "Animation & motion-graphics identity: storyboarding, rigging, and rendering a shot brief to an animated frame sequence"

[[identities]]
name = "simard-kinema"
default_mode = "engineer"
supported_base_types = [
  "local-harness",
  "terminal-shell",
  "rusty-clawd",
  "copilot-sdk",
  "claude-agent-sdk",
  "ms-agent-framework",
]
required_capabilities = [
  "prompt-assets",
  "session-lifecycle",
  "memory",
  "evidence",
  "reflection",
]

[[identities.prompt_assets]]
id = "kinema-system"
path = "kinema_system.md"

[identities.memory_policy]
allow_project_writes = false
summary_scope = "session-summary"

[[identities.seed_goals]]
priority = 3
title = "Storyboard a shot from a brief"
description = """
Take a shot brief to a storyboard — an ordered set of key panels that describe
every object's placement across the shot's beats — using the kinema-storyboarding
goal-session recipe.
"""

[[identities.seed_goals]]
priority = 3
title = "Rig the shot's characters and objects"
description = """
Derive an armature for every object in the shot (a full skeleton for characters,
a transform rig for shapes) so the renderer can pose and animate them, using the
kinema-rigging goal-session recipe.
"""

[[identities.seed_goals]]
priority = 2
title = "Render a shot brief to an animated sequence end-to-end"
description = """
Drive a shot brief through storyboard → rig → a rendered PNG frame sequence with
a verified manifest, driving Blender (Grease Pencil), Synfig, and Natron when
available and the built-in rasterizer otherwise, using the kinema-rendering
goal-session recipe. Done when the animated frame sequence is rendered and
verified.
"""
