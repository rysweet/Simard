# cartographer-explore.yaml — Cartographer identity, PHASE 1 of 4 (explore).
#
# Exploratory data analysis for the Simard Cartographer identity. Takes a
# dataset + a question and produces evidence-backed FINDINGS the later phases
# (visualize -> deliver -> narrative) build on. The canonical persona is
# prompt_assets/simard/cartographer_system.md; this recipe inlines the
# explore-phase contract so editing it changes analysis behaviour with no
# rebuild.
#
# Context vars (passed via -c):
#   dataset_path      — ABSOLUTE path to the dataset file (csv/parquet/json/…).
#                       Delivered via path, never inlined, so large datasets
#                       never overflow ARG_MAX.
#   question          — the question the operator wants answered.
#   findings_output   — ABSOLUTE path to the clean result FILE the agent writes
#                       its findings JSON to. The Rust caller reads findings
#                       from THIS file, never from recipe-runner stdout.
#
# Output (clean result channel, NOT stdout scraping): a JSON object written to
# `findings_output`:
#   {
#     "profile":   { "rows": <n>, "columns": [ {"name","dtype","nulls","notes"} ] },
#     "restated_question": "<what the data can answer>",
#     "cannot_answer": ["<limits>"],
#     "findings": [ {"claim":"…","evidence":"<computation/number>","confidence":"high|medium|low"} ],
#     "hypotheses": ["…"]
#   }
# If the dataset cannot be read or the question is unanswerable, the agent still
# writes the JSON with an empty `findings` array and populated `cannot_answer`
# (FAIL HONEST — never fabricate findings).

name: "cartographer-explore"
description: "Cartographer — exploratory data analysis of a dataset+question into evidence-backed findings"
version: "1.0.0"
author: "Simard"
tags: ["simard", "cartographer", "data-storytelling", "explore"]

context:
  dataset_path: ""
  question: ""
  findings_output: ""

steps:
  - id: "explore"
    type: "agent"
    agent: "default"
    prompt: |
      You are **Simard in Cartographer mode**, running the EXPLORE phase. Your
      job is exploratory data analysis: profile the dataset and answer, with
      real code, what it says about the question.

      Work the discipline: **inspect -> act -> verify -> persist**. Inspect the
      data before charting anything; act with the smallest analytical step;
      verify every number against the raw data; persist findings you can
      reproduce.

      ## Inputs

      The dataset is at this ABSOLUTE path (read it with your file/code tools —
      it is NOT inlined):

      ```
      {{dataset_path}}
      ```

      The question to answer:

      ```
      {{question}}
      ```

      ## What to do

      1. **Profile** the dataset: row count, columns, dtypes, null/unique
         counts, ranges, cardinalities, obvious outliers and encoding issues.
      2. **Restate** the question in terms the data can actually answer, and
         name explicitly what it CANNOT answer.
      3. **Find the signals**: distributions, trends, correlations, segments,
         anomalies. Use robust summaries; do not cherry-pick single points.
      4. Record **findings** as short claims, each with the evidence
         (computation/number) behind it and a confidence level.

      ## Hard rules (zero-BS)

      - NO fabrication. Every number and claim must come from the actual data
        and be reproducible. If you did not compute it, do not state it.
      - State uncertainty and data limits explicitly.
      - If the data cannot answer the question, say so — write an empty
        `findings` array and populate `cannot_answer`. FAIL HONEST; never invent
        an answer.

      ## Where to put the result (clean result channel)

      Write ONLY the findings JSON object to the result file at this ABSOLUTE
      path, using your file-writing tool:

      ```
      {{findings_output}}
      ```

      The file must contain the JSON and NOTHING ELSE — no preamble, no status
      lines, no tool-call narration, no code fence. Your terminal output
      (stdout) is IGNORED; only this file's contents are consumed. The JSON
      shape is:

      {"profile": {"rows": <n>, "columns": [{"name": "…", "dtype": "…", "nulls": <n>, "notes": "…"}]},
       "restated_question": "…", "cannot_answer": ["…"],
       "findings": [{"claim": "…", "evidence": "…", "confidence": "high|medium|low"}],
       "hypotheses": ["…"]}

      If you cannot write the file, stop and report the failure — do not emit
      the findings to stdout instead.
    output: "cartographer_findings"
