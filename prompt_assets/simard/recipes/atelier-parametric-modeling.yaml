# atelier-parametric-modeling.yaml — Atelier goal-session recipe.
#
# Drives the parametric-modeling phase of the Atelier identity: take a product
# brief and produce a parametric OpenSCAD model, an STL mesh, and a PNG render
# via the `simard atelier` command surface. Parser-free / agentic: the CLI call
# is the business outcome; the agent's prose is diagnostic only.
#
# Context vars (passed via -c):
#   simard_binary  — path to the simard binary
#   brief_path     — path to the product-brief JSON
#   out_dir        — directory to write the fabrication package into

name: "atelier-parametric-modeling"
description: "Atelier — take a product brief to a parametric model + STL + render"
version: "1.0.0"
author: "Simard"
tags: ["simard", "atelier", "design", "parametric", "cad"]

context: {}

steps:
  - id: "atelier-model"
    type: "agent"
    agent: "default"
    prompt: |
      # Atelier — Parametric Modeling

      You are Simard Atelier's parametric-modeling actor. Interpret the product
      brief directly; do not emit or parse a marker or JSON verdict.

      brief path = {{brief_path}}
      output dir = {{out_dir}}

      ## Inspect

      Read the product brief at `{{brief_path}}`. Confirm the product type,
      overall dimensions, material and stock thickness, and joinery method. If
      any required parameter is missing, contradictory, or physically
      impossible, STOP and record the specific problem — do not guess.

      ## Act

      Generate the parametric model and its exports with your bash tool:

      "{{simard_binary}}" atelier build \
        --brief "{{brief_path}}" \
        --out "{{out_dir}}"

      This writes, under `{{out_dir}}`: `model.scad` (parametric source),
      `model.stl` (mesh), `render.png` (preview), `cutlist.csv`, `bom.csv`, and
      `manifest.json`. The command drives OpenSCAD; FreeCAD/Blender exports are
      attempted when available and recorded as skipped when not.

      ## Verify

      Read `{{out_dir}}/manifest.json`. Confirm `model.stl` and `render.png`
      exist and are non-empty and that `verification.ok` is true. If the CLI
      failed or verification did not pass, stop and report the failure; do not
      fabricate success.

  - id: "atelier-model-verifier"
    type: "agent"
    agent: "default"
    prompt: |
      Verify the parametric-modeling package produced by the prior step by
      inspecting the manifest with your bash tool:

      "{{simard_binary}}" atelier inspect --out "{{out_dir}}"

      If it reports the STL and render are present and verification passed, stop
      successfully. Otherwise, re-read the brief at {{brief_path}} and the
      manifest, determine what is missing, and re-run
      `{{simard_binary}} atelier build --brief {{brief_path}} --out {{out_dir}}`.
      The durable fabrication package is the only business outcome.
