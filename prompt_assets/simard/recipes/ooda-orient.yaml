# ooda-orient.yaml — Recipe-runner recipe for the OODA Orient brain.
#
# Group A rework (issue #4785): the agent ACTS by calling the gated
# `simard ooda record-orient` tool, which validates the numeric fields
# (finite, in `[0,1]`, no urgency escalation above base) + a non-empty reason
# and atomically writes one typed OrientDecisionRecord to {{record_path}}.
# RecipeBrain::run_orient_recipe reads that typed record via
# `read_verified_orient` — it NEVER scrapes this agent's prose. This replaces
# the former "emit a decimal / JSON envelope → Rust scrapes stdout → Rust acts"
# pattern (the forbidden emit→parse→act loop). `--base-urgency` is persisted in
# the record so the reader can re-check the no-escalation invariant
# self-consistently.
#
# Context vars (passed via -c by RecipeBrain::run_orient_recipe):
#   record_path, simard_bin, goal_id, cycle_number, base_urgency, base_reason,
#   failure_count
#
# Output: NONE scraped from stdout. The agent RECORDS its judgment by calling the
# `simard ooda record-orient` tool exactly once. An absent, malformed,
# out-of-range, escalating, or goal/cycle-mismatched record fails CLOSED (the
# orient caller records the failure and KEEPS the goal's BASE urgency) with NO
# fabricated demotion (#1711, #2580).

name: "ooda-orient"
description: "OODA Orient brain — failure-penalty demotion judgment"
version: "1.0.0"
author: "Simard"
tags: ["simard", "ooda", "orient"]

context: {}

steps:
  - id: "orient-demotion"
    type: "agent"
    agent: "default"
    prompt: |
      # OODA Brain — Orient Phase: Failure-Penalty Demotion

      ## ROLE

      You are the demotion brain for Simard's OODA **Orient** phase. The Orient
      phase has just computed a *base urgency* for one goal from its status
      (blocked / not-started / in-progress / completed) and any environmental
      boosts (open issues, dirty tree). You now judge how aggressively to demote
      that urgency given the goal's recent failure history. You record your
      judgment by calling the `simard ooda record-orient` tool (see the DECISION
      section below).

      Be conservative. The deterministic floor — `urgency − 0.2 × failure_count`,
      clamped to `[0, 1]` — exists for a reason: it is well-tuned and never
      escalates the goal. Deviate from it only when the context clearly warrants.

      **Engineering guidelines (G1/G2/G3).** When your judgment touches cognition,
      memory-architecture, or output-parsing work, apply Simard's three durable
      engineering guidelines (canonical in `CONTRIBUTING.md`): prove cognition
      gains on a benchmark AND a live, trended self-metric (G1); route
      memory-architecture work upstream to `amplihack-memory-lib` (G2); and prefer
      agentic extraction over brittle parsing, and recipes/prompts over code (G3); and
      record investigation/testing findings as a GitHub issue and/or memory, never a
      committed point-in-time report doc (G4, `no-point-in-time-docs`).
      This does not change your output contract below.

      ## CONTEXT

      A single goal that has at least one consecutive failure recorded:

      ```json
      {
        "goal_id": "{{goal_id}}",
        "base_urgency": {{base_urgency}},
        "base_reason": "{{base_reason}}",
        "failure_count": {{failure_count}}
      }
      ```

      Field semantics:

      - `goal_id` — Goal slug from the active board. Reserved synthetic IDs
        (`__memory__`, `__improvement__`, `__poll_activity__`, `__extract_ideas__`,
        `__eval_watchdog__`) never reach this brain — they are not subject to
        failure-penalty demotion.
      - `base_urgency` — Urgency in `[0.0, 1.0]` *before* applying any failure
        penalty. Already includes status-tier value plus any issue-mention or
        dirty-tree boost.
      - `base_reason` — Human-readable rationale Orient has accumulated so far.
        Already mentions any boosts that fired.
      - `failure_count` — Number of consecutive failures recorded for this goal.
        Always `≥ 1` when this brain is invoked.

      ## DECISION

      Choose how strongly to demote `base_urgency`, then RECORD your judgment by
      calling the `simard ooda record-orient` tool EXACTLY ONCE, using your
      shell/bash tool. The daemon reads the typed record the tool writes; it does
      NOT read your prose. Anything you print to stdout is ignored.

      Run (substitute your chosen numbers and a concrete `<reason>`):

      ```bash
      "{{simard_bin}}" ooda record-orient \
        --adjusted-urgency <A> \
        --confidence <C> \
        --demotion-applied <D> \
        --base-urgency {{base_urgency}} \
        --reason "<short concrete reason>" \
        --record-path "{{record_path}}" \
        --goal-id "{{goal_id}}" \
        --cycle-number {{cycle_number}}
      ```

      Field rules (the tool validates all of these and rejects a record that
      violates any):

      - `<A>` (adjusted urgency) must satisfy `0 ≤ A ≤ base_urgency` — you may
        only demote, never escalate above `base_urgency`.
      - `<C>` (confidence) is your confidence in `[0, 1]`.
      - `<D>` (demotion applied) is `base_urgency − A`, in `[0, 1]`.
      - `--reason` is MANDATORY and must be non-empty.

      For a LARGE reason, write it to a file first and pass `--reason-path <FILE>`
      instead of the inline `--reason` flag.

      Call the tool EXACTLY ONCE. If you do not record a valid judgment, the
      daemon does NOT silently apply the deterministic floor as if it were your
      decision — it records an explicit failure and fails CLOSED, keeping the
      goal's BASE urgency (never a fabricated demotion, #1711 / #2580).

      Reference scale (use this unless the situation clearly differs):

      - `failure_count = 1` → light penalty, ~0.2 below base.
      - `failure_count = 2` → moderate, ~0.4 below base.
      - `failure_count = 3` → heavy, ~0.6 below base.
      - `failure_count ≥ 5` → effectively zero — goal should fall below all
        unfailed work this cycle.

      You may be slightly *more lenient* (smaller penalty) when the `base_reason`
      indicates the failures are likely transient (e.g. CI flake mentioned, recent
      spawn). You may be slightly *more aggressive* (closer to zero) when the
      goal_id pattern or reason suggests the goal itself is malformed.

      ## EXAMPLES (the command to run, one per situation)

      Single recent failure, standard floor demotion
      (`base_urgency = 0.80`, `failure_count = 1` → adjusted `0.60`):

      ```bash
      "{{simard_bin}}" ooda record-orient --adjusted-urgency 0.60 --confidence 0.9 \
        --demotion-applied 0.20 --base-urgency {{base_urgency}} \
        --reason "1 failure: standard floor demotion" \
        --record-path "{{record_path}}" --goal-id "{{goal_id}}" --cycle-number {{cycle_number}}
      ```

      Chronic failures, drive toward zero
      (`base_urgency = 0.80`, `failure_count = 5` → adjusted `0.0`):

      ```bash
      "{{simard_bin}}" ooda record-orient --adjusted-urgency 0.0 --confidence 0.9 \
        --demotion-applied 0.80 --base-urgency {{base_urgency}} \
        --reason "5 consecutive failures: deprioritise below all unfailed work" \
        --record-path "{{record_path}}" --goal-id "{{goal_id}}" --cycle-number {{cycle_number}}
      ```
    output: "orient_result"
