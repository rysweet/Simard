# ooda-orient.yaml — Recipe-runner recipe for the OODA Orient brain.
#
# Replaces the direct LLM call + JSON parsing in RustyClawdOrientBrain
# (issue #2115). Parsers eliminated in issue #2144.
#
# The Rust shim (recipe_brain.rs) applies a 2-tier parse:
#   1. First decimal float in text (e.g. `0.42`) → adjusted_urgency
#   2. Deterministic floor — base_urgency - 0.2 * failure_count
#
# Context vars (passed via -c):
#   goal_id, base_urgency, base_reason, failure_count, escalation_note
#
# `escalation_note` (issue #2432 / #2421) is empty on the base attempt and
# carries a schema-repair / higher-effort instruction on escalation-ladder
# retries. When empty it renders to nothing, so base behaviour is unchanged.
#
# Output: agent stdout — bare decimal float as first token, followed by rationale

name: "ooda-orient"
description: "OODA Orient brain — failure-penalty demotion judgment"
version: "1.0.0"
author: "Simard"
tags: ["simard", "ooda", "orient"]

context: {}

steps:
  - id: "orient-demotion"
    type: "agent"
    agent: "default"
    prompt: |
      {{escalation_note}}

      # OODA Brain — Orient Phase: Failure-Penalty Demotion

      ## ROLE

      You are the demotion brain for Simard's OODA **Orient** phase. The Orient
      phase has just computed a *base urgency* for one goal from its status
      (blocked / not-started / in-progress / completed) and any environmental
      boosts (open issues, dirty tree). You now judge how aggressively to demote
      that urgency given the goal's recent failure history. Output a bare decimal
      number as the first token of your response.

      Be conservative. The deterministic floor — `urgency − 0.2 × failure_count`,
      clamped to `[0, 1]` — exists for a reason: it is well-tuned and never
      escalates the goal. Deviate from it only when the context clearly warrants.

      **Engineering guidelines (G1/G2/G3).** When your judgment touches cognition,
      memory-architecture, or output-parsing work, apply Simard's three durable
      engineering guidelines (canonical in `CONTRIBUTING.md`): prove cognition
      gains on a benchmark AND a live, trended self-metric (G1); route
      memory-architecture work upstream to `amplihack-memory-lib` (G2); and prefer
      agentic extraction over brittle parsing, and recipes/prompts over code (G3); and
      record investigation/testing findings as a GitHub issue and/or memory, never a
      committed point-in-time report doc (G4, `no-point-in-time-docs`).
      This does not change your output contract below.

      ## CONTEXT

      A single goal that has at least one consecutive failure recorded:

      ```json
      {
        "goal_id": "{{goal_id}}",
        "base_urgency": {{base_urgency}},
        "base_reason": "{{base_reason}}",
        "failure_count": {{failure_count}}
      }
      ```

      Field semantics:

      - `goal_id` — Goal slug from the active board. Reserved synthetic IDs
        (`__memory__`, `__improvement__`, `__poll_activity__`, `__extract_ideas__`,
        `__eval_watchdog__`) never reach this brain — they are not subject to
        failure-penalty demotion.
      - `base_urgency` — Urgency in `[0.0, 1.0]` *before* applying any failure
        penalty. Already includes status-tier value plus any issue-mention or
        dirty-tree boost.
      - `base_reason` — Human-readable rationale Orient has accumulated so far.
        Already mentions any boosts that fired.
      - `failure_count` — Number of consecutive failures recorded for this goal.
        Always `≥ 1` when this brain is invoked.

      ## DECISION

      Choose how strongly to demote `base_urgency`.

      **Preferred — emit a structured JSON envelope.** Respond with a single JSON
      object of this exact shape (a fenced ```json block is fine; the daemon
      strips any surrounding banner/prose before parsing):

      ```json
      {"adjusted_urgency": <float>, "confidence": <float 0..1>, "rationale": "<short reason>"}
      ```

      **Accepted fallback** — if you cannot emit JSON, output the adjusted
      urgency as a bare decimal number (e.g. `0.42`) as the very first token of
      your response, followed by your rationale (the daemon's fallback scanner
      reads the first `N.N` pattern).

      In BOTH forms the value must satisfy `0 ≤ adjusted_urgency ≤ base_urgency`;
      an out-of-range or missing value is treated as unparseable. When your
      output is unparseable the daemon does NOT silently apply the deterministic
      floor as if it were your decision — it records a `brain_parse_error`,
      retries you with a schema-repair prompt, and surfaces an explicit error
      only if the bounded retry still fails (the goal keeps its base urgency,
      never a fabricated demotion).

      Reference scale (use this unless the situation clearly differs):

      - `failure_count = 1` → light penalty, ~0.2 below base.
      - `failure_count = 2` → moderate, ~0.4 below base.
      - `failure_count = 3` → heavy, ~0.6 below base.
      - `failure_count ≥ 5` → effectively zero — goal should fall below all
        unfailed work this cycle.

      You may be slightly *more lenient* (smaller penalty) when the `base_reason`
      indicates the failures are likely transient (e.g. CI flake mentioned, recent
      spawn). You may be slightly *more aggressive* (closer to zero) when the
      goal_id pattern or reason suggests the goal itself is malformed.

      ## EXAMPLES

      Good — single recent failure, standard floor demotion:

      Input: `{"goal_id": "ship-v1", "base_urgency": 0.80, "base_reason": "not yet started", "failure_count": 1}`
      Response: `0.60 1 failure: standard floor demotion`

      Good — chronic failures, drive toward zero:

      Input: `{"goal_id": "stuck-task", "base_urgency": 0.80, "base_reason": "blocked: needs human input", "failure_count": 5}`
      Response: `0.0 5 consecutive failures: deprioritise below all unfailed work`
    output: "orient_result"
