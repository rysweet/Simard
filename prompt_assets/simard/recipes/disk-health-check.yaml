# disk-health-check.yaml — Agent-based disk health check that ACTS via a tool.
#
# Invoked by src/disk_health.rs via recipe-runner-rs. An agent surveys disk
# usage on the home partition and, when space is tight, reclaims stale artifacts
# by calling the safety-enforcing `simard disk` tool — exactly the way
# distill-episodes.yaml commits facts via `simard memory remember`.
#
# ## What changed (issue #4722)
#
# The recipe no longer PRINTS `DISK_USED_PCT=`/`FREED_BYTES=`/`ACTION:` markers
# for Simard to scrape back out of recipe stdout, and it never runs `rm` itself.
# That parse-then-act was the forbidden "recipe emits output → Rust parses →
# Rust acts" pattern. Instead the agent CALLS the `simard disk` tool, which
# enforces the disk-safety heuristic INTERNALLY (it only reclaims a worktree or
# target dir whose PR is merged/closed AND that has no active recipe/engineer
# session; it never uses a `git merge-base --is-ancestor` staleness test). There
# is no return document for anyone to parse.
#
# Context vars (passed via -c):
#   state_root  — path to ~/.simard (worktrees, backups, cargo dirs live here)
#   repo_path   — the Simard source worktree root
#
# Output: NONE on stdout. The agent's `simard disk` invocations ARE the effect.
# Whatever the agent prints is ignored — Simard interprets this recipe by its
# EXIT STATUS alone (src/disk_health.rs::run_disk_health_check -> Ok(true) on
# exit 0, Ok(false) on non-zero).

name: "disk-health-check"
description: "Agent-based disk health check that reclaims via the safety-enforcing `simard disk` tool"
version: "3.0.0"
author: "Simard"
tags: ["simard", "disk", "maintenance", "ops"]

context:
  state_root: "~/.simard"
  repo_path: "/home/azureuser/src/Simard/worktrees/main"

steps:
  - id: "check-and-clean"
    type: "agent"
    agent: "default"
    prompt: |
      You are a disk health maintenance agent for Simard. Your job is to check
      disk usage and, when space is tight, free it by calling the
      **`simard disk`** command-line tool. You have bash tools available.

      ## The tool does the deleting — never `rm` yourself

      `simard disk` enforces the disk-safety heuristic internally: it only
      reclaims a worktree or `target/` dir whose PR is **merged or closed** AND
      that has **no active recipe/engineer session**, and it re-vets every
      candidate immediately before removing anything. You MUST reclaim through
      this tool. Do **not** run `rm`, `git worktree remove`, or any direct delete
      command yourself, and do **not** print `DISK_USED_PCT=`/`FREED_BYTES=`/
      `ACTION:` markers — there is nothing to parse.

      Tool surface:
      ```
      simard disk report  --path <P> [--path <P> …]      # vet + summarise, never deletes
      simard disk report  --paths @<file>                # newline-delimited path list (NOT JSON)
      simard disk reclaim --path <P> [--path <P> …]      # guarded delete (APPLY by default)
      simard disk reclaim --path <P> --dry-run           # vet only, delete nothing
      ```
      A large candidate list must be passed with `--paths @<file>` (one path per
      line), never inlined into a single huge argument.

      Exit-code contract: `0` = handled (a candidate was reclaimed OR safely
      skipped by a guard rail — a per-candidate rejection is NOT an error);
      `1` = operational failure; `2` = refused (apply-as-root). A skip is normal
      and safe — the tool is refusing to delete something still in use.

      ## Procedure

      1. **Measure current disk usage** on the home partition:
         ```
         df -B1 --output=pcent,avail "$HOME" | tail -1
         ```
         Strip the `%` and read the available bytes.

      2. **If usage is below 80%**, no cleanup is needed. Stop immediately — do
         not scan or reclaim anything.

      3. **If usage is 80% or above**, enumerate candidate paths (largest yield
         first), then hand them to the tool. Be more aggressive as pressure
         rises (95% warrants surveying more than 82% does). Candidate sources:

         - **Cargo `target/` build caches** (the biggest consumer):
           `{{repo_path}}/target/`, `{{repo_path}}/worktrees/*/target/`,
           `{{state_root}}/cargo-target/`, `{{state_root}}/shared-target/`.
         - **Engineer worktrees** under `{{state_root}}/engineer-worktrees/*` and
           `{{repo_path}}/worktrees/*` (the tool keeps any whose PR is not
           merged/closed or that has a live session — trust it).
         - **Old database backups** in `{{state_root}}/backups/` — but the tool
           does not manage backups; if you must prune those, keep at least the 5
           most recent and delete older ones by hand only if they are plainly
           disposable. Prefer letting the tool handle worktrees and caches.

      4. **Survey first, then reclaim.** For the candidate paths you gathered:
         ```
         printf '%s\n' <path> <path> … > /tmp/disk-candidates.txt
         simard disk report --paths @/tmp/disk-candidates.txt
         simard disk reclaim --paths @/tmp/disk-candidates.txt
         ```
         (or per-path `simard disk reclaim --path <P>`). The tool applies its own
         guard rails; candidates it skips are correctly protected. If `simard
         disk` is unavailable, fall back to `simard disk-reclaim` only if that
         subcommand exists — otherwise stop without deleting anything by hand.

      5. **Re-check** with `df -B1 --output=pcent "$HOME" | tail -1`. If usage is
         back under 80%, stop.

      ## Output

      There is **no output file and no JSON to print**. Your `simard disk`
      invocations ARE the output. Whatever you print to the terminal is ignored;
      Simard interprets this run by its EXIT STATUS alone. Finish successfully
      once you have surveyed and (if needed) reclaimed via the tool.
    output: "disk_health_report"
