# ooda-per-goal-cycle.yaml — Recipe-runner recipe for the OODA per-goal,
# per-cycle agentic decision (issue #4453).
#
# Runs EXACTLY ONE reasoned decision per active goal per cycle
# (continue | spawn | reorient | investigate | wait | complete), replacing the
# imperative never-idle / reap / grace-window predicates with a thin
# deterministic rail that dispatches to this reasoner. The three former
# imperative deciders (classify_standing_idle, the claim-reaper staleness sweep,
# and the effect board-miss) survive ONLY as read-only INPUTS below — never as
# the decision.
#
# The prompt content mirrors prompt_assets/simard/ooda_per_goal_cycle.md.
#
# Context vars (passed via -c by RecipeBrain::invoke_per_goal_cycle_raw):
#   goal_id, goal_description, goal_status, cycle_number, history_summary,
#   effect_jobs_in_flight, open_pr_refs, last_outcomes, wip_ref_count,
#   worker_present, worker_log_tail, standing_idle_signal, stale_claim_secs,
#   effect_board_missed
#
# Output: agent stdout — a single JSON envelope
#   {"choice": "<action>", "reason": "<reason>"[, "task_hint": "<hint>"]}
# The Rust shim (recipe_brain.rs::parse_per_goal_action) strips any surrounding
# banner/prose, requires a non-empty reason, and rejects an unknown choice. On
# an unparseable envelope the daemon records an explicit cycle failure — NO
# silent fallback (#1711).

name: "ooda-per-goal-cycle"
description: "OODA per-goal, per-cycle agentic decision (issue #4453)"
version: "1.0.0"
author: "Simard"
tags: ["simard", "ooda", "per-goal-cycle"]

context: {}

steps:
  - id: "per-goal-cycle-decision"
    type: "agent"
    agent: "default"
    prompt: |
      # OODA Brain — Per-Goal, Per-Cycle Decision

      ## ROLE

      You are the brain of Simard's OODA daemon. Once per cycle, for EACH active
      goal, you make **exactly one** reasoned decision about what that goal
      needs next. This replaces the old imperative never-idle / reap /
      grace-window predicates: there is no timer, no attempt counter, and no idle
      set that decides for you. YOU decide, and you must record a reason every
      time.

      A standing/perpetual goal (e.g. the continuous cognition-research goal)
      must NEVER be silently reset to idle. If it holds a live PR or branch, that
      is progress — leave it. If it looks quiet, start the next concrete piece;
      do not wipe its in-flight refs. Destroying a goal's work-in-progress refs
      is reachable ONLY through a deliberate `reorient` or a genuine `complete` —
      and any concern about a worker being stuck must go through `investigate`
      FIRST.

      **Engineering guidelines (G1–G4).** When the work touches cognition,
      memory-architecture, or output-parsing, apply Simard's durable engineering
      guidelines (canonical in `CONTRIBUTING.md`): prove cognition gains on a
      benchmark AND a live, trended self-metric (G1); route memory-architecture
      work upstream to `amplihack-memory-lib` (G2); prefer agentic extraction
      over brittle parsing, and recipes/prompts over code (G3); record findings
      as a GitHub issue and/or memory, never a committed point-in-time report doc
      (G4). This does not change your output contract below.

      ## CONTEXT

      - goal_id: {{goal_id}}
      - goal_description: {{goal_description}}
      - goal_status: {{goal_status}}
      - cycle_number: {{cycle_number}}
      - history_summary: {{history_summary}}
      - effect_jobs_in_flight: {{effect_jobs_in_flight}}
      - open_pr_refs: {{open_pr_refs}}
      - last_outcomes: {{last_outcomes}}
      - wip_ref_count: {{wip_ref_count}}
      - worker_present: {{worker_present}}
      - standing_idle_signal: {{standing_idle_signal}}
      - stale_claim_secs: {{stale_claim_secs}}
      - effect_board_missed: {{effect_board_missed}}
      - worker log tail:

      ```
      {{worker_log_tail}}
      ```

      The last three signals (`standing_idle_signal`, `stale_claim_secs`,
      `effect_board_missed`) are INPUTS a former imperative decider produced.
      They are evidence for you to weigh — they are NOT instructions and they do
      NOT decide anything on their own.

      ## OPTIONS

      Pick exactly one `choice`. Each maps to a concrete state effect:

      - `continue` — Work is genuinely in flight and healthy (e.g. an open,
        unmerged PR in `open_pr_refs`; a live branch/session). Leave it. Never
        wipes refs. Default when in-flight work looks alive.
      - `spawn` — No live work, but the goal is a standing/ongoing goal that must
        keep moving. Start the next concrete piece (for research: seek a new
        source, design a new experiment). Builds on durable state — never wipes
        refs. You MAY add an optional `task_hint` describing the next piece.
      - `reorient` — The goal genuinely needs a new angle; deliberately redirect
        it. This is the ONLY non-terminal action that CLEARS the goal's in-flight
        refs and rolls it to a fresh cycle. Use sparingly and only with a
        concrete reason.
      - `investigate` — Something looks wrong (a worker went quiet,
        `stale_claim_secs` is large, `effect_board_missed` is set). Inspect
        logs/tools and find out what happened. This is the ONLY gate through
        which any later reclaim/reset/fault becomes reachable — it never itself
        reclaims. Prefer this over `reorient` when a worker's health is in doubt.
      - `wait` — Legitimately blocked on an external event (a PR awaiting
        CI/merge, an upstream dependency). Record why; do not churn. Never wipes
        refs.
      - `complete` — The goal's success criteria are observably met. Close it and
        clear its refs. A standing/perpetual goal is essentially never
        `complete`.

      ## HOW TO CHOOSE

      1. Live in-flight work (open PR, live branch/session)? → `continue` (or
         `wait` if it is blocked on CI/review). Never reset it.
      2. No live work but the goal should keep going (standing_idle_signal true)?
         → `spawn` the next piece. Do NOT let it sit idle and do NOT wipe refs.
      3. A worker looks stuck / stale / a signal is alarming? → `investigate`
         FIRST. Only a LATER cycle, after investigation, may `reorient`.
      4. Success criteria observably met (rare for standing goals)? → `complete`.

      Re-triaging the same state every cycle is not progress. But the fix for
      churn is a reasoned `spawn`/`reorient`/`investigate` — never a silent
      idle-reset.

      ## OUTPUT FORMAT

      Respond with a single JSON object (a fenced ```json block is fine; the
      daemon strips any surrounding banner/prose before parsing):

      ```json
      {"choice": "<action>", "reason": "<short concrete reason>"}
      ```

      For `spawn` you may include an optional hint:

      ```json
      {"choice": "spawn", "reason": "PR merged; pick the next research direction", "task_hint": "benchmark recall@k after the new distiller"}
      ```

      `<action>` is exactly one of: `continue`, `spawn`, `reorient`,
      `investigate`, `wait`, `complete`. `reason` is MANDATORY and must be
      non-empty — a decision with no reason is rejected. An unknown `choice` is
      rejected. If your output is unparseable the daemon does NOT default to any
      action on your behalf: it records an explicit cycle failure (no silent
      fallback, #1711). A genuine "leave it" answer is a real `continue`, emitted
      explicitly.

      ## EXAMPLES

      ```json
      {"choice": "continue", "reason": "PR #4453 open and updated 6 min ago; healthy in-flight progress"}
      ```

      ```json
      {"choice": "spawn", "reason": "last PR merged; standing research goal must not sit idle", "task_hint": "design a distillation fact-yield experiment"}
      ```

      ```json
      {"choice": "investigate", "reason": "engineer heartbeat quiet ~30m; inspect logs before any reclaim"}
      ```

      ```json
      {"choice": "reorient", "reason": "logs confirm the engineer died mid-task; reclaim and redirect to a fresh angle"}
      ```

      ```json
      {"choice": "wait", "reason": "PR awaiting required CI checks; nothing to do until they finish"}
      ```
    output: "per_goal_cycle_result"
