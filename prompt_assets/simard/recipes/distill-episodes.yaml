# distill-episodes.yaml — Recipe for episode distillation (issue #2281; semantic
# handoff #2679).
#
# Periodic many-to-few extraction: given a batch of up to 50 recent episodes,
# classify each into one of three concept labels (or `skip`) and commit the
# derived facts DIRECTLY into cognitive memory.
#
# ## What changed in #2679
#
# The distiller no longer PRINTS or WRITES a `{ "facts": [...] }` envelope for
# Simard to scrape back out of recipe stdout and hand-deserialize. That
# deserialize was the single failure surface — one trailing comma, one stray log
# line, one ANSI escape from the launcher banner made the strict parse fail and
# discarded the ENTIRE batch (the #2658/#2679 parse-fail mode). Instead the
# distiller is now a TRUE agentic step whose WRITES are its output: it calls the
# `simard memory remember` tool once per fact. Those writes land in the same
# store Simard reads from, through the daemon's authoritative write-boundary gate
# (grounding + reliability scoring + quarantine + dedup are all server-side).
# There is no return document for anyone to parse, so a malformed token can no
# longer discard anything.
#
# Context vars (passed via -c):
#   episodes_path — ABSOLUTE path to a file containing the JSON array of episode
#     objects, each { id, source_label, temporal_index, content } (issues
#     #2640/#2692). A batch of up to 50 full-text episodes is unbounded, so it is
#     delivered via a file and never inlined into argv. The agent READS this file.
#   memory_socket — ABSOLUTE path to the OODA daemon's memory IPC socket. The
#     `simard memory remember` tool also reads this from the SIMARD_MEMORY_SOCKET
#     environment variable, which the distill subprocess exports, so a bare
#     `simard memory remember ...` reaches the right daemon. This var is provided
#     for reference / explicit `--` state-root use.
#
# Pass-id ledger (issue #2679): the distill subprocess also exports a
# SIMARD_DISTILL_PASS_ID environment variable that tags every fact this pass
# commits, so the daemon can count accepted facts on a path with no return
# document. The `simard memory remember` tool reads that env var itself — the
# agent MUST NOT pass a `--pass-id` flag (it is intentionally absent from the
# flag list below). Inheriting the pass id via the environment, rather than
# relying on the agent to echo a flag, is what keeps the fact count correct
# without reintroducing an LLM-formatting failure surface.
#
# Output: NONE on stdout. The agent's fact/procedure WRITES (via the tool) are
# the entire output. Whatever the agent prints to the terminal is ignored —
# Simard interprets this recipe by its EXIT STATUS alone.
#
# See docs/architecture/distillation-semantic-handoff.md for the full contract,
# concept-label semantics, retry-safety invariants, and the write-boundary gate.

name: "distill-episodes"
description: "Distill a batch of recent episodes into semantic facts, committed directly to memory"
version: "2.0.0"
author: "Simard"
tags: ["simard", "memory", "distillation"]

context:
  # Empty by default; the distill subprocess overrides this with the absolute
  # path of the per-invocation episodes file the agent must read (issues
  # #2640/#2692). Declared so the `{{episodes_path}}` substitution always
  # resolves, even when the recipe is run without the override.
  episodes_path: ""
  # Empty by default; the distill subprocess overrides this with the absolute
  # path of the daemon's memory IPC socket (issue #2679). Declared so the
  # `{{memory_socket}}` substitution always resolves.
  memory_socket: ""

steps:
  - id: "distill"
    type: "agent"
    agent: "default"
    prompt: |
      You are the **semantic distiller** for Simard's cognitive memory.
      You are given a batch of recent **episodes** (events that happened
      during prior OODA cycles) and you produce a small number of
      durable **semantic facts** that you WRITE DIRECTLY into cognitive
      memory using the `simard memory remember` command-line tool.

      ## Input

      The batch of episodes is a JSON array. Each entry has:

      - `id` — opaque episode identifier you must echo back as
        `--source-episode-id` when you derive a fact from it.
      - `source_label` — short tag describing where the episode came
        from (e.g. `goal-curator`, `consolidation-persistence`).
      - `temporal_index` — monotonic ordering key (NOT a wall-clock
        timestamp; you only need it for ordering, if at all).
      - `content` — the free-text payload of the episode.

      The batch is saved to a file (it is too large to pass inline). **Read the
      file at this absolute path** with your file-reading tool and use its FULL
      contents as the episodes array:

      ```
      {{episodes_path}}
      ```

      ## Your job

      Walk the episodes and decide which are worth distilling. For each
      episode you keep, WRITE **exactly one** fact into memory by running
      the `simard memory remember` tool with these scalar flags:

      - `--concept` — one of:
        - `pr-pattern` — pull-request shaped events: merge sequences,
          CI patterns, review patterns, scope-creep observations.
        - `bug-pattern` — bug reproductions, root causes, recurring
          failure modes, environmental fragility.
        - `lesson-learned` — decisions made, tradeoffs encountered,
          things that surprised the engineer, retrospective insights.
      - `--content` — a **short, declarative** sentence capturing the
        durable lesson (≤ 200 chars is ideal). NOT a transcript; NOT a
        timestamp; just the takeaway. Quote it so spaces are preserved.
      - `--source-episode-id` — the `id` from the source episode,
        verbatim. This is what grounds the fact; a fact whose id is not in
        the batch is quarantined by the server, so ALWAYS pass a real id.

      Run ONE command per fact. For example:

      ```
      simard memory remember \
        --concept=bug-pattern \
        --content="empty outcome list panics the cycle loop" \
        --source-episode-id=<id-from-input>
      ```

      Episodes that are pure noise (startup logs, simple retries,
      progress chatter, exact duplicates of earlier episodes) should be
      **skipped** — do NOT run `remember` for them. The system records
      that you saw them via a separate mechanism, so dropping low-value
      episodes is the correct call.

      ### Procedures (optional)

      If — and only if — the batch reveals a **recurring action
      sequence** (the same multi-step workflow appearing across two or
      more episodes), ALSO write a procedure with the companion tool:

      ```
      simard memory remember-procedure \
        --name=ci-fix:auto \
        --step="read the failing job log" \
        --step="reproduce locally" \
        --step="apply the minimal fix" \
        --source-episode-id=<id> --source-episode-id=<id>
      ```

      - `--name` — a short, stable handle (e.g. `ci-fix:auto`,
        `pr:merge-flow`). Reuse the same name across batches for the same
        workflow so the store reinforces rather than duplicates it.
      - `--step` — one per step, in order (repeat the flag).
      - `--source-episode-id` — the `id`s of the episodes the procedure
        was distilled from (≥ 1; repeat the flag).

      Do NOT invent procedures for one-off events. A batch with no
      recurring workflow writes no procedure.

      ## Output

      There is **no output file and no JSON to print**. Your `simard memory
      remember` / `remember-procedure` invocations ARE the output. The server
      grounds, scores, and either stores or quarantines each fact and prints its
      disposition; you do not need to parse or report that. If nothing in the
      batch is worth keeping, simply run no `remember` commands and finish
      successfully.

      Do not invent new concept labels. Do not invent episode ids. Do not
      pass the literal string `skip` as a concept — a skipped episode simply
      gets no `remember` call.
