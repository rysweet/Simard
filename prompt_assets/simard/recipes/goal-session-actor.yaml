# Parser-free terminal actor for one goal-session cycle.
#
# The recipe runner passes raw semantic values by private file path. The final
# actor reads those files as opaque context and invokes exactly one scoped
# terminal capability. Its stdout and stderr are diagnostic only.

name: "goal-session-actor"
description: "Choose and durably record one typed goal-session terminal"
version: "1.0.0"
author: "Simard"
tags: ["simard", "ooda", "act", "typed-capabilities"]

context: {}

steps:
  - id: "goal-session-actor"
    type: "bash"
    timeout: 1800
    command: |
      "{{simard_binary}}" ooda actor-run \
        --ledger-path "{{ledger_path}}" \
        --policy-path "{{policy_path}}" \
        --session-id "{{session_id}}" \
        --cycle-id "{{cycle_id}}" \
        --goal-id "{{goal_id}}" \
        --task-path "{{task_path}}" \
        --reason-path "{{reason_path}}" \
        --observe-output-path "{{observe_output_path}}" \
        --orient-output-path "{{orient_output_path}}" \
        --decide-output-path "{{decide_output_path}}" \
        --auth-token-path "{{auth_token_path}}" \
        --admission-path "{{admission_path}}"
