site_name: Simard
site_description: An autonomous engineer who drives and curates agentic coding systems
site_url: https://rysweet.github.io/Simard/
repo_url: https://github.com/rysweet/Simard
repo_name: rysweet/Simard

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

# Discoverability & link-integrity gate (mkdocs-native; enforced under --strict).
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  nav:
    omitted_files: warn        # every docs/*.md must appear in nav (0 orphans)
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn              # catch dead #anchors across pages
    absolute_links: warn
    unrecognized_links: warn

