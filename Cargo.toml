[package]
name = "simard"
version = "0.27.0"
edition = "2024"
default-run = "simard"

[[bin]]
name = "simard-gym"
path = "src/bin/simard_gym.rs"

[[bin]]
name = "simard-rust-gym"
path = "src/bin/simard_rust_gym.rs"

[[bin]]
name = "simard-ooda-step"
path = "src/bin/simard_ooda_step.rs"

[[bin]]
name = "simard-improve-step"
path = "src/bin/simard_improve_step.rs"

[[bin]]
name = "simard-self-improve-recipe"
path = "src/bin/simard_self_improve_recipe.rs"

[[bin]]
name = "simard-engineer-step"
path = "src/bin/simard_engineer_step.rs"

[[bin]]
name = "simard-engineer-loop-recipe"
path = "src/bin/simard_engineer_loop_recipe.rs"

[[bin]]
name = "simard-audit-pass01"
path = "src/bin/simard_audit_pass01.rs"
required-features = ["dashboard-audit"]

[[bin]]
name = "simard-audit-dashboard"
path = "src/bin/simard_audit_dashboard.rs"
required-features = ["dashboard-audit"]

[[bin]]
name = "simard-tui"
path = "src/bin/simard_tui/main.rs"

[dependencies]
# De-fork phase 2b (issue #2307): the amplihack-memory-lib `CognitiveMemory`
# (persistent, lbug-backed `GraphStore`) is now the SOLE cognitive-memory
# backend. `cognitive_memory::library_adapter::LibraryCognitiveMemory` drives it
# behind Simard's `CognitiveMemoryOps` trait; the native LadybugDB fork has been
# deleted. The `persistent` feature builds LadybugDB through the published
# `lbug = "=0.17.1"` crate.
#
# Pinned to the amplihack-memory-lib commit that carries the lbug 0.15.4 -> 0.17.1
# engine migration, the issue #107 silent-empty-read fix (the `_deleted`
# tombstone read-path fix + the empty-read safety gate), the issue #2550 durable
# corrupt-WAL open recovery fix (a failed checkpoint-after-recovery now salvages
# the recovered graph into a fresh, strict-reopen-verified database instead of
# leaving records only in the quarantined WAL — which a later open reset to empty,
# permanently dropping tens of thousands of memories), AND the read-only
# `get_all_prospective` enumerator (Simard #2550) the verified-backup snapshot
# needs to capture prospective memories. Further bumped to the squash-merge commit
# of amplihack-memory-lib PR #118 on `main` (issue #117), which layers the
# deterministic episodic->semantic distillation fact-yield benchmark + extractor
# on top of PR #111 (via #114/#116), with no lbug/engine change, so the store
# format stays v41. Bumped again (issue #2626) to amplihack-memory-lib PR #119
# on `main` (a durable recall-quality regression benchmark — precision@k + MRR —
# plus a tokenizer fix), again with no lbug/engine change, so the store format
# stays v41.
#
# Bumped again to the squash-merge commit of amplihack-memory-lib PR #121 on
# `main` (which lands directly on top of PR #119), adding the decoupled
# `measurement::precision_at_k` recall-quality primitive (guideline G2 —
# memory-measurement scoring lives upstream, not forked into Simard). Simard's
# `cognitive_memory::metrics::precision_at_k` now delegates to it, and the
# fixed-corpus recall-precision benchmark + live rail both score through the same
# upstream primitive (issue #2491 / #2494). No lbug/engine change, so the store
# format stays v41. The pin points at an upstream-`main` commit (not a feature
# branch), so the build can never be frozen against an unmerged, GC-able ref.
amplihack-memory = { git = "https://github.com/rysweet/amplihack-memory-lib.git", rev = "2266cc247d66c773c33300546a97502d53497c20", features = ["persistent"] }
rustyclawd-core = { git = "https://github.com/rysweet/RustyClawd.git", rev = "ddae0fdf1b922ae8604b0a4e178a3634ada7e350" }
rustyclawd-tools = { git = "https://github.com/rysweet/RustyClawd.git", rev = "ddae0fdf1b922ae8604b0a4e178a3634ada7e350" }
# De-fork (issue #2323): the gym/eval RUNNER is now the upstream
# `amplihack-agent-eval` crate (native Rust GymRunner + scenario/result types),
# replacing the private `src/native_gym.rs` reimplementation. Only the bridge
# wiring (`src/gym_runner_bridge.rs`) and Simard-specific scoring/history stay
# in this crate. The crate is a light workspace member (serde/serde_json/
# thiserror/tracing/chrono only — no heavy workspace deps are transitive).
# Bumped (issue #2626) to the current HEAD of amplihack-rs `main` (verified via
# `git ls-remote`); the delta is workflow/recipe/CI-tooling fixes only, with the
# `amplihack-agent-eval` crate surface (GymRunner/GymConfig/GymScenarioResult)
# and the reverted workspace version 0.11.1 unchanged.
amplihack-agent-eval = { git = "https://github.com/rysweet/amplihack-rs.git", rev = "2a93441d1837f9f853d5dddc56cc1088353a8872" }
# De-fork phase 2b (issue #2307): the native cognitive-memory fork is gone, but
# `lbug` is still a direct dependency of the standalone `simard-tui` binary
# (`src/bin/simard_tui/goals.rs`), which opens a LadybugDB read-only to render
# the goal board. The cognitive-memory backend itself no longer uses lbug
# directly — it goes through the amplihack-memory library. Bumped to 0.17.1 in
# lockstep with the amplihack-memory pin so the final binary links exactly one
# engine and one storage format (v41).
lbug = "=0.17.1"
rusqlite = { version = "=0.31.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
toml = "=1.1.2"
tokio = { version = "=1.52.1", features = ["rt", "rt-multi-thread", "process", "io-util", "time", "net", "macros", "sync"] }
axum = { version = "=0.8.9", features = ["ws"] }
tower-http = { version = "=0.6.8", features = ["cors", "auth"] }
uuid = { version = "=1.23.1", features = ["v4", "v7"] }
chrono = "=0.4.44"
dirs = "=6.0.0"
crc32fast = "=1.5.0"
sha2 = "=0.10.9"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }
ctrlc = { version = "=3.5.2", features = ["termination"] }
nix = { version = "=0.29.0", features = ["signal", "fs"] }
opentelemetry = "=0.27.1"
opentelemetry-otlp = "=0.27.0"
tracing-opentelemetry = "=0.28.0"
opentelemetry_sdk = { version = "=0.27.1", features = ["rt-tokio"] }
tempfile = "=3.27.0"
ratatui = "=0.29.0"
crossterm = "=0.28.1"
headless_chrome = { version = "=1.0.21", optional = true, default-features = false }
regex = { version = "=1.12.3", optional = true }
url = { version = "=2.5.8", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.185"

[features]
# Issue #2576: every FUNCTIONAL/runtime capability ships in a plain `cargo build`
# — no shippable feature is opt-in. `default` therefore enables `signal` (the
# operator Signal conversation channel) and `dashboard-audit` (the headless
# dashboard audit tools), so a stock binary is fully capable and `simard signal
# run` reaches its real config path instead of a "not compiled in" stub. Build a
# deliberately minimal binary with `--no-default-features`.
default = ["signal", "dashboard-audit"]

# THE ONE INTENTIONAL EXCEPTION to the "features are default" rule (issue #2576):
# `slow-tests` is NOT a shippable product capability — it is a TEST-SELECTION gate
# that turns on the slow, long-running `#[cfg(feature = "slow-tests")]` tests.
# Defaulting it would force those slow tests into every `cargo test` / CI run and
# blow up CI time for zero runtime benefit, so it stays opt-in. Enable explicitly
# with `cargo test --features slow-tests` when you want the slow suite.
slow-tests = []
dashboard-audit = ["dep:headless_chrome", "dep:regex", "dep:url"]
# Issue #2527: the Signal conversation channel (`src/signal_conversation/`).
# Built by DEFAULT since issue #2576 (see `default` above) so the daemon ships
# signal-capable with no opt-in flag. The transport reuses tokio `net` (already a
# dependency), so enabling this adds no new mandatory dependency. Drop it only via
# an explicit `--no-default-features` minimal build.
signal = []

[dev-dependencies]
assert_cmd = "=2.2.1"
proptest = "=1.11.0"
serial_test = "=3.4.0"
# Used only by the `serial_guard` regression meta-test (issue #2360) to parse
# the source tree and enforce the `serial(cognitive_memory)` contract. Both are
# already in the dependency graph transitively (pinned to the locked versions);
# this only promotes them to explicit dev-deps and enables the features the
# AST scan needs. `span-locations` gives the scan accurate file:line offenders.
syn = { version = "=2.0.117", features = ["full", "visit"] }
proc-macro2 = { version = "=1.0.106", features = ["span-locations"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false

# Dev/test profiles: minimal debuginfo philosophy.
#
# Goal: keep panics useful (file:line in backtraces for OUR crate) without
# carrying gigabytes of dependency debuginfo. `target/debug/` was ~38GB
# before this; almost all of that was dependency .rmeta + loose DWARF
# split-debug fragments.
#
# Strategy:
# 1. line-tables-only on our own crate → Simard panics still show
#    file:line in backtraces.
# 2. debug = 0 on every dependency → dependency stack frames lose
#    file:line (they show as `<unknown>:?`) but we almost never need to
#    debug into dep internals; cuts ~80% of debug-build size.
# 3. split-debuginfo unset → embedded DWARF; no loose .o fragments.
# 4. incremental = false in dev → no per-build accumulation in
#    target/debug/incremental.
#
# Re-enable full debug for one build with:
#   RUSTFLAGS='-C debuginfo=2'
# or
#   CARGO_PROFILE_DEV_DEBUG=2 cargo build
[profile.dev]
debug = "line-tables-only"
incremental = false
strip = "debuginfo"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
incremental = false
strip = "debuginfo"

[profile.test.package."*"]
debug = false
