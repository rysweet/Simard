[package]
name = "simard"
version = "0.37.0"
edition = "2024"
default-run = "simard"

[[bin]]
name = "simard-gym"
path = "src/bin/simard_gym.rs"

[[bin]]
name = "coin-gym"
path = "src/bin/coin_gym.rs"

[[bin]]
name = "simard-rust-gym"
path = "src/bin/simard_rust_gym.rs"

[[bin]]
name = "simard-ooda-step"
path = "src/bin/simard_ooda_step.rs"

[[bin]]
name = "simard-improve-step"
path = "src/bin/simard_improve_step.rs"

[[bin]]
name = "simard-self-improve-recipe"
path = "src/bin/simard_self_improve_recipe.rs"

[[bin]]
name = "simard-engineer-step"
path = "src/bin/simard_engineer_step.rs"

[[bin]]
name = "simard-engineer-loop-recipe"
path = "src/bin/simard_engineer_loop_recipe.rs"

[[bin]]
name = "simard-audit-pass01"
path = "src/bin/simard_audit_pass01.rs"
required-features = ["dashboard-audit"]

[[bin]]
name = "simard-audit-dashboard"
path = "src/bin/simard_audit_dashboard.rs"
required-features = ["dashboard-audit"]

[[bin]]
name = "simard-tui"
path = "src/bin/simard_tui/main.rs"

# Issue #2741: scheduled supply-chain advisory remediation driver. Thin wrapper
# over `simard::supply_chain_steward`; run daily by .github/workflows/advisory-scan.yml.
[[bin]]
name = "supply-chain-steward"
path = "src/bin/supply_chain_steward.rs"

[dependencies]
# De-fork phase 2b (issue #2307): the amplihack-memory-lib `CognitiveMemory`
# (persistent, lbug-backed `GraphStore`) is now the SOLE cognitive-memory
# backend. `cognitive_memory::library_adapter::LibraryCognitiveMemory` drives it
# behind Simard's `CognitiveMemoryOps` trait; the native LadybugDB fork has been
# deleted. The `persistent` feature builds LadybugDB through the published
# `lbug = "=0.17.1"` crate.
#
# Pinned to the amplihack-memory-lib commit that carries the lbug 0.15.4 -> 0.17.1
# engine migration, the issue #107 silent-empty-read fix (the `_deleted`
# tombstone read-path fix + the empty-read safety gate), the issue #2550 durable
# corrupt-WAL open recovery fix (a failed checkpoint-after-recovery now salvages
# the recovered graph into a fresh, strict-reopen-verified database instead of
# leaving records only in the quarantined WAL — which a later open reset to empty,
# permanently dropping tens of thousands of memories), AND the read-only
# `get_all_prospective` enumerator (Simard #2550) the verified-backup snapshot
# needs to capture prospective memories. Further bumped to the squash-merge commit
# of amplihack-memory-lib PR #118 on `main` (issue #117), which layers the
# deterministic episodic->semantic distillation fact-yield benchmark + extractor
# on top of PR #111 (via #114/#116), with no lbug/engine change, so the store
# format stays v41. Bumped again (issue #2626) to amplihack-memory-lib PR #119
# on `main` (a durable recall-quality regression benchmark — precision@k + MRR —
# plus a tokenizer fix), again with no lbug/engine change, so the store format
# stays v41.
#
# Bumped again to the squash-merge commit of amplihack-memory-lib PR #121 on
# `main` (which lands directly on top of PR #119), adding the decoupled
# `measurement::precision_at_k` recall-quality primitive (guideline G2 —
# memory-measurement scoring lives upstream, not forked into Simard). Simard's
# `cognitive_memory::metrics::precision_at_k` now delegates to it, and the
# fixed-corpus recall-precision benchmark + live rail both score through the same
# upstream primitive (issue #2491 / #2494). No lbug/engine change, so the store
# format stays v41.
#
# Bumped again to the squash-merge commit of amplihack-memory-lib PR #120 on
# `main` (which lands directly on top of PR #121), adding the first-class
# `creative_idea` prospective memory type (CreativeIdeaStatus lifecycle state
# machine + typed MemoryLink/MemoryLinkKind edges incl. Goal; guideline G2)
# which Simard's Creative Ideas thread re-exports. This pin therefore carries
# BOTH the measurement primitive (#121) and the creative-idea memory type (#120)
# with no lbug/engine change, so the store format stays v41. The pin points at an
# upstream-`main` commit (not a feature branch), so the build can never be frozen
# against an unmerged, GC-able ref.
#
# Bumped again (issue #122) to the squash-merge commit of amplihack-memory-lib
# PR #125 on `main` (2 commits ahead of the #120 pin, no regression), which adds
# `get_prospective_by_trigger(trigger, limit)` — a trigger-scoped, priority-
# ordered prospective query whose LIMIT bounds only matching nodes — and makes
# `get_all_prospective` sort-then-truncate. Simard consumes the new primitive to
# fix the creative-ideas dashboard read path (ideas fell outside the unscoped
# 512-row window in a large store). Still an upstream-`main` commit; store format
# stays v41 (no lbug/engine change).
#
# Bumped again (issue #40) to the squash-merge commit of amplihack-memory-lib
# PR #126 on `main` (1 commit ahead of the #125 pin): the bulk graph-adjacency
# index for ranked recall. Ranked declarative/episodic recall previously computed
# the graph-proximity term with a per-node `query_neighbors` BFS — an N+1 fan-out
# of ~3N lock-serialized Cypher scans per recall that made the OODA daemon's
# prepare-context spin ~11 min/cycle at ~7,590 facts. The fix serves that term
# from one bulk edge scan per type: a pure performance refactor with
# byte-identical ranking. Still an upstream-`main` commit; store format stays v41
# (no lbug/engine change).
#
# Bumped again (issue #3119) to the squash-merge commit of amplihack-memory-lib
# PR #129 on `main` (1 commit ahead of the #126 pin): the lbug portability fix.
# The published crates.io `lbug 0.17.1` SIGSEGVs in `std::vformat` during
# `Database::initBufferManager` on hosts whose libstdc++ `std::format` ABI differs
# from the prebuilt's (e.g. Ubuntu 26.04), and its build.rs also double-links the
# bundled third-party archives in source-build mode (duplicate symbols). #129 pins
# `lbug` to the `rysweet/ladybug-rust` fork (build.rs keeps `link_bundled_deps=false`
# and links only the self-contained `liblbug.a`), so building from source both cures
# the ABI SIGSEGV and links cleanly with no unsafe `--allow-multiple-definition`.
# The fork engine writes on-disk storage format v42 (forward-only from v41; the
# v40->v41+ no-data-loss gate now accepts v41-or-newer). Simard's direct `lbug` dep
# below is repointed at the SAME fork rev in lockstep so the final binary links
# exactly one engine.
#
# Issue #4687 (WAL crash-consistency): bumped OFF the WAL-corrupting rev
# c266e15d… to the single-owner / fsync-durable WAL fix. The pin targets the
# WAL-only fix commit `0031505b…` (branch `fix/issue-4687-wal-only-on-c266e15`,
# durably anchored by tag `issue-4687-wal-crash-consistency-c266e15`), which is
# the SAME diff as the upstream `main` squash-merge (b3033f7…, PR #144) applied
# directly onto Simard's current base c266e15. We deliberately do NOT pin to the
# `main` merge commit yet: `main` also carries the #137 multi-writer coordination
# layer (a new engine-level single-writer store lock), which is a separate,
# out-of-scope adoption for Simard and would break the pre-existing
# concurrent-open cognitive-memory tests. Keeping the pin WAL-only stays
# additive/non-breaking and preserves store format v42. Follow-up: adopt the
# coordination layer and repin to `main` in its own change.
amplihack-memory = { git = "https://github.com/rysweet/amplihack-memory-lib.git", rev = "0031505b911151bf47409694a6c45f8b778d91b9", features = ["persistent"] }
rustyclawd-core = { git = "https://github.com/rysweet/RustyClawd.git", rev = "dcccad80ed381c66a7728565be5cb84120aacbed" }
rustyclawd-tools = { git = "https://github.com/rysweet/RustyClawd.git", rev = "dcccad80ed381c66a7728565be5cb84120aacbed" }
# De-fork (issue #2323): the gym/eval RUNNER is now the upstream
# `amplihack-agent-eval` crate (native Rust GymRunner + scenario/result types),
# replacing the private `src/native_gym.rs` reimplementation. Only the bridge
# wiring (`src/gym_runner_client.rs`) and Simard-specific scoring/history stay
# in this crate. The crate is a light workspace member (serde/serde_json/
# thiserror/tracing/chrono only — no heavy workspace deps are transitive).
# Bumped (issue #2626) to the current HEAD of amplihack-rs `main` (verified via
# `git ls-remote`); the delta is workflow/recipe/CI-tooling fixes only, with the
# `amplihack-agent-eval` crate surface (GymRunner/GymConfig/GymScenarioResult)
# and the reverted workspace version 0.11.1 unchanged.
amplihack-agent-eval = { git = "https://github.com/rysweet/amplihack-rs.git", rev = "14dc30b10e87764120c6f2bae7f3630522c29e5d" }
# De-fork phase 2b (issue #2307): the native cognitive-memory fork is gone, but
# `lbug` is still a direct dependency of the standalone `simard-tui` binary
# (`src/bin/simard_tui/goals.rs`), which opens a LadybugDB read-only to render
# the goal board. The cognitive-memory backend itself no longer uses lbug
# directly — it goes through the amplihack-memory library. Pinned to the
# `rysweet/ladybug-rust` fork (issue #3119) at the SAME rev amplihack-memory uses,
# so cargo unifies to exactly one `lbug` crate / one engine / one storage format.
# The fork fixes the from-source duplicate-symbol link and the libstdc++
# std::format ABI SIGSEGV; see amplihack-memory docs/lbug_libstdcxx_abi.md.
lbug = { git = "https://github.com/rysweet/ladybug-rust", rev = "5a2c107881879f4d1bb594b14967948870e65cdc" }
rusqlite = { version = "=0.31.0", features = ["backup", "bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
# Issue #2250: the launch-time update check compares semver versions with the
# `semver` crate and fetches the latest GitHub release in-process via `ureq`
# (rustls TLS). Both were already in the locked dependency graph transitively;
# these entries promote them to pinned direct deps.
semver = "=1.0.28"
ureq = "=3.3.0"
toml = "=1.1.2"
tokio = { version = "=1.52.1", features = ["rt", "rt-multi-thread", "process", "io-util", "time", "net", "macros", "sync"] }
axum = { version = "=0.8.9", features = ["ws"] }
tower-http = { version = "=0.6.8", features = ["cors", "auth"] }
uuid = { version = "=1.23.1", features = ["v4", "v7"] }
chrono = "=0.4.44"
# Issue #2727: the dashboard header renders the deployment/build timestamp in
# US Pacific time with the date-correct PST/PDT abbreviation. chrono-tz is the
# idiomatic tz-database crate for the runtime UTC->America/Los_Angeles
# conversion (chrono alone has no DST-aware named zones). `=`-pinned to match
# the repo convention (e.g. `chrono = "=0.4.44"`); the pin is what makes the
# %Z abbreviation reproducible and lets the PST/PDT unit tests act as a guard.
chrono-tz = "=0.10.4"
dirs = "=6.0.0"
crc32fast = "=1.5.0"
sha2 = "=0.10.9"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }
ctrlc = { version = "=3.5.2", features = ["termination"] }
nix = { version = "=0.29.0", features = ["signal", "fs"] }
opentelemetry = "=0.27.1"
opentelemetry-otlp = "=0.27.0"
tracing-opentelemetry = "=0.28.0"
opentelemetry_sdk = { version = "=0.27.1", features = ["rt-tokio"] }
tempfile = "=3.27.0"
ratatui = "=0.29.0"
crossterm = "=0.28.1"
headless_chrome = { version = "=1.0.21", optional = true, default-features = false }
regex = { version = "=1.12.3", optional = true }
url = { version = "=2.5.8", optional = true }
# Issue #2631: the Overseer's authenticated STARTTLS + AUTH LOGIN email relay
# (`StartTlsSmtpSender` in src/overseer/notify.rs) reaching e.g. office365. All
# three are already in the locked dependency graph transitively; this promotes
# them to direct deps at exact pins matching Cargo.lock. `rustls` enables the
# `ring` crypto provider explicitly so the relay never relies on an ambiguous
# process-default provider, and `--no-default-features` still builds. `base64`
# encodes the AUTH LOGIN payload (inside TLS only). No secret is ever hardcoded —
# SMTP credentials come solely from the environment.
base64 = "=0.22.1"
rustls = { version = "=0.23.38", features = ["ring"] }
rustls-native-certs = "=0.8.3"
webpki-roots = "=1.0.7"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.185"

# Issue #2727: build.rs formats the baked deployment instant
# (SIMARD_BUILD_TIMESTAMP) as an RFC3339 UTC string and parses SOURCE_DATE_EPOCH
# for reproducible builds. `=`-pinned to the same chrono as [dependencies].
[build-dependencies]
chrono = "=0.4.44"

[features]
# Issue #2576: every FUNCTIONAL/runtime capability ships in a plain `cargo build`
# — no shippable feature is opt-in. `default` therefore enables `signal` (the
# operator Signal conversation channel) and `dashboard-audit` (the headless
# dashboard audit tools), so a stock binary is fully capable and `simard signal
# run` reaches its real config path instead of a "not compiled in" stub. Build a
# deliberately minimal binary with `--no-default-features`.
default = ["signal", "dashboard-audit"]

# TWO INTENTIONAL EXCEPTIONS to the "features are default" rule (issue #2576):
# `slow-tests` and `canary-tests` are NOT shippable product capabilities — they
# are TEST-SELECTION gates. Defaulting either would force test-only scaffolding
# into every `cargo test` / CI run for zero runtime benefit, so both stay opt-in.
#
# `slow-tests` turns on the slow, long-running `#[cfg(feature = "slow-tests")]`
# tests. Enable with `cargo test --features slow-tests`.
slow-tests = []

# `canary-tests` (issue #4622) turns on the curated, hermetic-by-construction
# self-deploy canary regression target (`tests/self_deploy_canary.rs`, selected
# by a whole-target `#![cfg(feature = "canary-tests")]` inner attribute). The
# self-deploy UnitTest canary enables it explicitly; stock `cargo test` and CI
# unit runs leave it off so they never pull in the canary-only scaffolding.
# Enable with `cargo test --test self_deploy_canary --features canary-tests`.
canary-tests = []
dashboard-audit = ["dep:headless_chrome", "dep:regex", "dep:url"]
# Issue #2527: the Signal conversation channel (`src/signal_conversation/`).
# Built by DEFAULT since issue #2576 (see `default` above) so the daemon ships
# signal-capable with no opt-in flag. The transport reuses tokio `net` (already a
# dependency), so enabling this adds no new mandatory dependency. Drop it only via
# an explicit `--no-default-features` minimal build.
signal = []

[dev-dependencies]
assert_cmd = "=2.2.1"
proptest = "=1.11.0"
serial_test = "=3.4.0"
# Used only by the `serial_guard` regression meta-test (issue #2360) to parse
# the source tree and enforce the `serial(cognitive_memory)` contract. Both are
# already in the dependency graph transitively (pinned to the locked versions);
# this only promotes them to explicit dev-deps and enables the features the
# AST scan needs. `span-locations` gives the scan accurate file:line offenders.
syn = { version = "=2.0.117", features = ["full", "visit"] }
proc-macro2 = { version = "=1.0.106", features = ["span-locations"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false

# Dev/test profiles: minimal debuginfo philosophy.
#
# Goal: keep panics useful (file:line in backtraces for OUR crate) without
# carrying gigabytes of dependency debuginfo. `target/debug/` was ~38GB
# before this; almost all of that was dependency .rmeta + loose DWARF
# split-debug fragments.
#
# Strategy:
# 1. line-tables-only on our own crate → Simard panics still show
#    file:line in backtraces.
# 2. debug = 0 on every dependency → dependency stack frames lose
#    file:line (they show as `<unknown>:?`) but we almost never need to
#    debug into dep internals; cuts ~80% of debug-build size.
# 3. split-debuginfo unset → embedded DWARF; no loose .o fragments.
# 4. incremental = false in dev → no per-build accumulation in
#    target/debug/incremental.
#
# Re-enable full debug for one build with:
#   RUSTFLAGS='-C debuginfo=2'
# or
#   CARGO_PROFILE_DEV_DEBUG=2 cargo build
[profile.dev]
debug = "line-tables-only"
incremental = false
strip = "debuginfo"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
incremental = false
strip = "debuginfo"

[profile.test.package."*"]
debug = false
