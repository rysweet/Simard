[package]
name = "simard"
version = "0.19.1"
edition = "2024"
default-run = "simard"

[[bin]]
name = "simard-gym"
path = "src/bin/simard_gym.rs"

[[bin]]
name = "simard-ooda-step"
path = "src/bin/simard_ooda_step.rs"

[[bin]]
name = "simard-improve-step"
path = "src/bin/simard_improve_step.rs"

[[bin]]
name = "simard-self-improve-recipe"
path = "src/bin/simard_self_improve_recipe.rs"

[[bin]]
name = "simard-engineer-step"
path = "src/bin/simard_engineer_step.rs"

[[bin]]
name = "simard-engineer-loop-recipe"
path = "src/bin/simard_engineer_loop_recipe.rs"

[[bin]]
name = "simard-audit-pass01"
path = "src/bin/simard_audit_pass01.rs"
required-features = ["dashboard-audit"]

[[bin]]
name = "simard-audit-dashboard"
path = "src/bin/simard_audit_dashboard.rs"
required-features = ["dashboard-audit"]

[[bin]]
name = "simard-tui"
path = "src/bin/simard_tui/main.rs"

[dependencies]
# De-fork phase 2a (issue #86): repointed at the library commit that ships the
# persistent lbug-backed GraphStore + pluggable `CognitiveMemory`. The
# `persistent` feature builds LadybugDB through the published `lbug = "=0.15.3"`
# crate — the SAME pin Simard's native backend already compiles, so cargo
# unifies the two and no *additional* C++ engine is built. The library-backed
# adapter (`cognitive_memory::library_adapter::LibraryCognitiveMemory`) and its
# parity tests are gated behind the `library-memory` feature below; this
# dependency just makes the library's `CognitiveMemory::open_persistent`
# constructor available to that gated module.
amplihack-memory = { git = "https://github.com/rysweet/amplihack-memory-lib.git", rev = "11b7dab054c399a603b812eff8941aace70d6e07", features = ["persistent"] }
rustyclawd-core = { git = "https://github.com/rysweet/RustyClawd.git", rev = "43ebaa1c1b18a5630c53f0519989a2bacd42ef62" }
rustyclawd-tools = { git = "https://github.com/rysweet/RustyClawd.git", rev = "43ebaa1c1b18a5630c53f0519989a2bacd42ef62" }
lbug = "=0.15.3"
rusqlite = { version = "=0.31.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
toml = "=1.1.2"
tokio = { version = "=1.52.1", features = ["rt", "rt-multi-thread", "process", "io-util", "time", "net", "macros", "sync"] }
axum = { version = "=0.8.9", features = ["ws"] }
tower-http = { version = "=0.6.8", features = ["cors", "auth"] }
uuid = { version = "=1.23.1", features = ["v4", "v7"] }
chrono = "=0.4.44"
dirs = "=6.0.0"
crc32fast = "=1.5.0"
sha2 = "=0.10.9"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }
ctrlc = { version = "=3.5.2", features = ["termination"] }
nix = { version = "=0.29.0", features = ["signal", "fs"] }
opentelemetry = "=0.27.1"
opentelemetry-otlp = "=0.27.0"
tracing-opentelemetry = "=0.28.0"
opentelemetry_sdk = { version = "=0.27.1", features = ["rt-tokio"] }
tempfile = "=3.27.0"
ratatui = "=0.29.0"
crossterm = "=0.28.1"
headless_chrome = { version = "=1.0.21", optional = true, default-features = false }
regex = { version = "=1.12.3", optional = true }
url = { version = "=2.5.8", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.185"

[features]
slow-tests = []
dashboard-audit = ["dep:headless_chrome", "dep:regex", "dep:url"]
# De-fork phase 2a (issue #86): gates the amplihack-memory-lib-backed
# cognitive-memory adapter (`LibraryCognitiveMemory`) and its parity tests
# alongside the native LadybugDB backend. OFF by default so the standard build
# compiles and runs ONLY the native path. The `amplihack-memory` dependency is
# always built with its `persistent` feature (reusing Simard's existing
# `lbug = "=0.15.3"` build), but the gated `library_adapter` module + its
# `pub use` re-export and the parity test (`cognitive_memory::
# tests_library_parity::library`) only compile when this feature is enabled.
library-memory = []

[dev-dependencies]
assert_cmd = "=2.2.1"
proptest = "=1.11.0"
serial_test = "=3.4.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false

# Dev/test profiles: minimal debuginfo philosophy.
#
# Goal: keep panics useful (file:line in backtraces for OUR crate) without
# carrying gigabytes of dependency debuginfo. `target/debug/` was ~38GB
# before this; almost all of that was dependency .rmeta + loose DWARF
# split-debug fragments.
#
# Strategy:
# 1. line-tables-only on our own crate → Simard panics still show
#    file:line in backtraces.
# 2. debug = 0 on every dependency → dependency stack frames lose
#    file:line (they show as `<unknown>:?`) but we almost never need to
#    debug into dep internals; cuts ~80% of debug-build size.
# 3. split-debuginfo unset → embedded DWARF; no loose .o fragments.
# 4. incremental = false in dev → no per-build accumulation in
#    target/debug/incremental.
#
# Re-enable full debug for one build with:
#   RUSTFLAGS='-C debuginfo=2'
# or
#   CARGO_PROFILE_DEV_DEBUG=2 cargo build
[profile.dev]
debug = "line-tables-only"
incremental = false
strip = "debuginfo"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
incremental = false
strip = "debuginfo"

[profile.test.package."*"]
debug = false
