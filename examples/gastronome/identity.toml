# Pluggable Gastronome identity (example)
#
# This demonstrates the *file-based* pluggable identity path: `FileIdentityLoader`
# reads an `identity.toml`, finds the requested `[[identities]]` entry by name,
# and builds the manifest — falling back to the built-in identities when the file
# or the name is absent. The built-in `simard-gastronome` identity in
# `src/identity/loader.rs` is the canonical registration; this file shows how a
# deployment could ship or override the same identity as data.
#
# Load it by pointing Simard's identity path at this directory and requesting
# `simard-gastronome`. Prompt-asset `path`s resolve against the prompt-assets
# root (see `prompt_assets/simard/`).

[package]
name = "gastronome-identity"
version = "0.1.0"
description = "Culinary, menu & event-design identity for Simard."

[[identities]]
name = "simard-gastronome"
default_mode = "orchestrator"
supported_base_types = [
  "local-harness",
  "rusty-clawd",
  "copilot-sdk",
  "claude-agent-sdk",
  "ms-agent-framework",
]
required_capabilities = [
  "prompt-assets",
  "session-lifecycle",
  "memory",
  "evidence",
  "reflection",
]

[[identities.prompt_assets]]
id = "gastronome-system"
path = "simard/gastronome_system.md"

[[identities.seed_goals]]
priority = 1
title = "Take an event/menu brief to a costed, scheduled plan"
description = "Given an EventBrief and a recipe book, design or select recipes per course, honour dietary constraints, and produce a costed, nutritionally analysed, prep-scheduled menu plan end to end."

[[identities.seed_goals]]
priority = 2
title = "Grow and curate the recipe book"
description = "Design new recipes (per-serving quantities, honest cost/nutrition, ordered timed steps, defensible dietary tags) and keep the book balanced across courses and constraints."
