# Loremaster — EXAMPLE non-engineering identity (TTRPG campaign design & game mastering).
#
# This is a DATA-ONLY package. It is loaded by the data-driven file loader
# (`load_example_identity`), NOT compiled into `BuiltinIdentityLoader`. It adds
# ZERO Rust to `src/`, no operator_cli subcommand, and no `src/bin/*`.
#
# NAMING: this example identity is named `loremaster`. There is **no** built-in
# `simard-loremaster` identity — Simard's OWN compiled-in identities are only
# `simard-engineer`, `simard-meeting`, `simard-gym`, `simard-goal-curator`,
# `simard-improvement-curator`, and `simard-composite-engineer` (in
# `src/identity/loader.rs`). The boundary is defined by WHERE an identity lives
# (compiled builtin vs. data under `examples/identities/`), not by its theme.
#
# The loremaster turns a campaign brief into a durable, playable tabletop-RPG
# campaign package: world lore & factions, NPCs, XP-budget-balanced encounters,
# session-prep material, and a Foundry VTT-ready module — then RUNS a session
# end to end (initiative -> combat -> resolution) to prove it plays. Its real
# behavior is delivered by the agentic recipes in `recipes/`, which may drive any
# external domain tooling (an SRD rules engine, a seeded dice roller, a Foundry
# VTT world exporter, an encounter-XP calculator). None of that tooling lives in
# Simard's daemon. Only open SRD content (SRD 5.1, CC-BY 4.0 / OGL) is used.

[package]
name = "loremaster"
version = "0.1.0"
description = "Example identity: campaign brief -> world lore + NPCs + XP-balanced encounters + session prep + a Foundry VTT module, then run a session end-to-end (open SRD content)"

[[identities]]
name = "loremaster"
default_mode = "curator"
supported_base_types = ["local-harness", "terminal-shell", "rusty-clawd"]
required_capabilities = ["prompt-assets", "session-lifecycle", "memory"]

[[identities.prompt_assets]]
id = "loremaster-system"
path = "prompts/loremaster_system.md"

[[identities.prompt_assets]]
id = "loremaster-lore"
path = "prompts/loremaster_lore.md"

[[identities.prompt_assets]]
id = "loremaster-encounters"
path = "prompts/loremaster_encounters.md"

[[identities.prompt_assets]]
id = "loremaster-prep"
path = "prompts/loremaster_prep.md"

[[identities.prompt_assets]]
id = "loremaster-deliver"
path = "prompts/loremaster_deliver.md"

[identities.memory_policy]
allow_project_writes = false
summary_scope = "session-summary"

[identities.authority]
posture = "read-only"
