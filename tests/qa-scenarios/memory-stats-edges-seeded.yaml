name: simard-memory-stats-edges-seeded
app_type: cli
description: |
  Seeded process-boundary coverage for the edges / dedup section of
  `simard memory stats` (issue #2331). There is no CLI write surface for the
  cognitive store, so the seeded path is exercised through the integration
  test that itself spawns the real `simard memory stats` binary against a
  store pre-loaded with a DERIVES_FROM provenance edge and a caller-key
  snapshot fact, then asserts the human + `--json` renderings report the
  seeded edge count, provenance coverage, and snapshot-dedup grouping.
agents:
  - name: cli-agent
    type: cli
    command: bash
steps:
  - action: run
    command: "cargo test --release --test bin_simard_memory_cli stats_shows_edges_and_dedup_section_via_direct_open -- --exact"
    timeout: 240s
  - action: expect_exit_code
    code: 0
  - action: expect_stdout
    contains: "test result: ok"
