name: terra-world-build-end-to-end
app_type: cli
description: |
  Outside-in coverage for the EXAMPLE Terra virtual-worlds &amp; game-level
  identity: a world brief must go end to end — world design &amp; blockout →
  terrain &amp; asset authoring → scene assembly → world brief — through the
  identity's agentic recipe, producing a launchable, navigable 3D scene, and the
  shipped DATA-ONLY package must load through the real Simard data-driven loader
  with a ZERO-line `src/` footprint.

  Terra is an example non-engineering identity authored purely as data under
  `examples/identities/terra/` (identity.toml + prompts/ + recipes/). It is
  loaded by `load_example_identity` (the thin data-driven rail), NEVER compiled
  into `BuiltinIdentityLoader`, and adds no domain Rust to `src/`, no operator_cli
  subcommand, and no `src/bin/*`. All domain tooling — Godot (game levels,
  GDScript, NavigationRegion3D navmesh, headless export), Blender (terrain + asset
  authoring via `bpy`, glTF/.glb export), and A-Frame / WebXR (in-browser
  explorable 3D worlds) — lives in the recipe and the agent sessions it spawns.

  Verified end to end by `tests/terra_assets_valid.rs`:
  - the shipped `examples/identities/terra/` package loads via the data-driven
    `load_example_identity` rail in curator mode, exposing all five phase prompts
    (system + worldplan + build + assemble + deliver);
  - the identity declares a read-only write posture and no project writes;
  - the package is NOT a builtin (the `BuiltinIdentityLoader` rejects it), proving
    it is data-driven, not compiled in;
  - every referenced prompt file exists, carries its stage heading, and instructs
    the agent to treat inputs as untrusted data;
  - the goal-session recipe `recipes/terra-world-build.yaml` drives the full
    four-stage pipeline (worldplan → build → assemble → write-world-brief), threads
    the `brief_path` / `engine` / `assets_dir` / `output_dir` / `world_scale`
    context vars, shells out to Godot / Blender / A-Frame, and requires verifying
    the scene launches and is navigable; and
  - a misspelled example name fails visibly (fail-closed), never silently falling
    back to a builtin identity.

  Schema note: the pinned `@gadugi/agentic-test` CLI runner gates only on
  `run`-step exit codes and reads the command from `params.command`, so the suite
  runs under a single `bash -lc` wrapper that exits zero only when the
  `terra_assets_valid` integration test reports success.
metadata:
  tags:
    - cli
    - terra
    - identity
    - example
agents:
  - name: cli-agent
    type: cli
    command: bash
steps:
  - action: run
    params:
      command: "bash -lc 'set -euo pipefail; cargo test --test terra_assets_valid 2>&1 | tee /tmp/terra-qa.log | grep -q \"test result: ok\"'"
    timeout: 600000
