name: atelier-brief-to-fabrication-package
app_type: cli
description: |
  Outside-in coverage for the Atelier industrial &amp; furniture-design identity:
  a product brief must go end to end to an exported 3D model, a render, and a
  fabrication package (cut list + BOM), and the shipped identity/policy/recipe
  assets must load through the real Simard loaders.

  Verified end to end:
  - `src/atelier/` unit tests: brief parsing/validation, parametric geometry,
    OpenSCAD source generation, cut list + BOM computation, tool probing, and
    the build/verify/inspect manifest orchestration.
  - `tests/atelier_assets_valid.rs`: the pluggable `simard-atelier` identity
    card loads via `FileIdentityLoader` in engineer mode, the goal-session
    capability policy parses via `CapabilityPolicy::from_toml_file` with the
    least-privilege shape, and both goal-session recipes drive the
    `simard atelier` CLI surface.
  - `tests/atelier_pipeline_e2e.rs`: `simard atelier build` takes the sample
    bookcase brief to `model.stl`, a render, `cutlist.csv`, `bom.csv`, and a
    `manifest.json` whose `verification.ok` is true (run only when OpenSCAD is
    installed; the pipeline degrades gracefully otherwise).

  Schema note: the pinned `@gadugi/agentic-test` CLI runner gates only on
  `run`-step exit codes and reads the command from `params.command`, so all
  suites run under a single `bash -lc` wrapper that exits zero only when every
  invoked `cargo test` reports success. The OpenSCAD-gated end-to-end suite is
  skipped (not failed) on hosts without OpenSCAD.
metadata:
  tags:
    - cli
    - atelier
    - identity
agents:
  - name: cli-agent
    type: cli
    command: bash
steps:
  - action: run
    params:
      command: "bash -lc 'set -euo pipefail; cargo test --lib atelier 2>&1 | tee /tmp/atelier-qa-unit.log | grep -q \"test result: ok\"; cargo test --test atelier_assets_valid 2>&1 | tee /tmp/atelier-qa-assets.log | grep -q \"test result: ok\"; if command -v openscad >/dev/null 2>&1; then cargo test --test atelier_pipeline_e2e 2>&1 | tee /tmp/atelier-qa-e2e.log | grep -q \"test result: ok\"; else echo \"openscad absent: skipping OpenSCAD-gated end-to-end suite\"; fi'"
    timeout: 600000
