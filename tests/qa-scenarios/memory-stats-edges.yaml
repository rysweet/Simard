name: simard-memory-stats-edges
app_type: cli
description: |
  Outside-in coverage for the graph-edge / dedup ("edges / connections")
  section added to `simard memory stats` (issue #2331). Drives the real
  release binary at the process boundary and asserts the section renders in
  both the human and `--json` outputs, and that the daemon-IPC tier surfaces
  the "run with daemon stopped for graph stats" note instead of misreporting
  zeros. Each step opens a hermetic state root under /tmp so the live
  ~/.simard store is never touched.
agents:
  - name: cli-agent
    type: cli
    command: bash
steps:
  # 1) Human output, direct on-disk open of a fresh store: the section and
  #    every edge / provenance / dedup label must appear (zeroed but present).
  - action: run
    command: "D=/tmp/qa-memstats-h-$$; rm -rf \"$D\"; cargo run --release --quiet --bin simard -- memory stats \"$D\""
    timeout: 120s
  - action: expect_exit_code
    code: 0
  - action: expect_stdout
    contains: "edges / connections"
  - action: expect_stdout
    contains: "DERIVES_FROM"
  - action: expect_stdout
    contains: "PROCEDURE_DERIVES_FROM"
  - action: expect_stdout
    contains: "SIMILAR_TO"
  - action: expect_stdout
    contains: "SUPERSEDES"
  - action: expect_stdout
    contains: "facts with provenance:"
  - action: expect_stdout
    contains: "snapshot dedup:"

  # 2) JSON output, direct on-disk open: stable scripting keys must be present.
  - action: run
    command: "D=/tmp/qa-memstats-j-$$; rm -rf \"$D\"; cargo run --release --quiet --bin simard -- memory stats \"$D\" --json"
    timeout: 120s
  - action: expect_exit_code
    code: 0
  - action: expect_stdout
    contains: "\"edges\""
  - action: expect_stdout
    contains: "\"derives_from\""
  - action: expect_stdout
    contains: "\"procedure_derives_from\""
  - action: expect_stdout
    contains: "\"similar_to\""
  - action: expect_stdout
    contains: "\"supersedes\""
  - action: expect_stdout
    contains: "\"provenance\""
  - action: expect_stdout
    contains: "\"facts_with_provenance\""
  - action: expect_stdout
    contains: "\"snapshot_dedup\""
  - action: expect_stdout
    contains: "\"distinct_caller_keys\""

  # 3) Daemon-IPC tier (human): a present-but-unconnectable socket forces the
  #    DaemonSocket tier, which has no graph reader -> the section prints the
  #    note instead of zeros. A dummy file at the socket path is enough: the
  #    connect fails and the report still labels the tier as the daemon socket.
  - action: run
    command: "D=/tmp/qa-memstats-dn-$$; rm -rf \"$D\"; mkdir -p \"$D\"; export SIMARD_MEMORY_SOCKET=\"$D/memory.sock\"; : > \"$SIMARD_MEMORY_SOCKET\"; cargo run --release --quiet --bin simard -- memory stats \"$D\""
    timeout: 120s
  - action: expect_exit_code
    code: 0
  - action: expect_stdout
    contains: "edges / connections"
  - action: expect_stdout
    contains: "run with daemon stopped for graph stats"

  # 4) Daemon-IPC tier (JSON): the note surfaces as `edges_note` rather than
  #    fabricated zero edge counts.
  - action: run
    command: "D=/tmp/qa-memstats-dj-$$; rm -rf \"$D\"; mkdir -p \"$D\"; export SIMARD_MEMORY_SOCKET=\"$D/memory.sock\"; : > \"$SIMARD_MEMORY_SOCKET\"; cargo run --release --quiet --bin simard -- memory stats \"$D\" --json"
    timeout: 120s
  - action: expect_exit_code
    code: 0
  - action: expect_stdout
    contains: "\"edges_note\""
  - action: expect_stdout
    contains: "run with daemon stopped for graph stats"
