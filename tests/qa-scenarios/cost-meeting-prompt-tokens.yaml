# Canonical agentic-test schema (name + agents[] + steps[] with params).
#
# Mirrors tests/qa-scenarios/dashboard-journal-merged-count.yaml (the repo's
# canonical exemplar): a single `cli` agent runs a hermetic regression script;
# the runner treats the script's non-zero exit as a step failure, so this is a
# real pass/fail gate.
name: simard-cost-meeting-prompt-tokens
description: >-
  The dashboard Resources → Costs tab (GET /api/costs) does not undercount
  meeting-mode prompt tokens (#4164). A meeting turn records the size of the
  FULL enriched prompt it streams to copilot on stdin, not the bare objective,
  so the prompt/completion token ratio and reported spend are honest.
version: "1.0"
config:
  timeout: 300000
environment:
  requires: []
agents:
  - name: cli-agent
    type: cli
    config: {}
metadata:
  tags:
    - cli
    - dashboard
    - cost
  priority: high
steps:
  - name: Run the meeting-mode prompt-token cost regression script
    agent: cli-agent
    action: run
    params:
      command: bash
      args:
        - scripts/qa-cost-meeting-prompt-tokens.sh
    timeout: 300000
