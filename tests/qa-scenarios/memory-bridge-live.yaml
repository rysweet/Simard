name: simard-memory-bridge-health
app_type: cli
description: Verify the native (in-process, pure-Rust) memory bridge answers a health check
steps:
  - action: run
    command: "cargo test --test bridge native_bridge_health_check_roundtrips --no-fail-fast -- --nocapture 2>&1 | tail -5"
    timeout: 120s
  - action: expect_stdout
    contains: 'test result: ok'
