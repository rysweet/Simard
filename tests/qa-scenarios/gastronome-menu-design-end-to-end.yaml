name: gastronome-menu-design-end-to-end
app_type: cli
description: |
  Outside-in coverage for the EXAMPLE Gastronome culinary menu- and event-design
  identity: a menu brief + constraints (headcount, dietary needs, budget, service
  time) must go end to end to a costed, nutrition-analyzed, service-scaled menu
  with a prep schedule, and the shipped DATA-ONLY identity package must load and
  drive that workflow through the real Simard loaders — with ZERO `src/` code.

  Verified end to end (via `tests/gastronome_assets_valid.rs`):
  - the `examples/identities/gastronome/` package loads through the data-driven
    `load_example_identity` rail (NOT `BuiltinIdentityLoader`), in curator mode,
    exposing its five menu-design prompts (system + compose + analyze + scale +
    schedule), each resolving as a contained `prompts/*.md` ref;
  - the identity is read-only and enables no project-scoped memory writes;
  - the package is genuinely data-only: it carries no `.rs` domain source, and
    `gastronome` is not loadable as a compiled-in builtin identity;
  - the agentic `gastronome-menu.yaml` recipe drives the full menu-design
    workflow: four ordered stages (compose -> nutrition & cost -> scale ->
    schedule) that mirror the prompts, the brief/headcount/dietary/budget/
    service_time/output_dir context surface, the untrusted-data guardrail, the
    nutrition/cost/scaling domain rigor, and durable menu-package persistence.

  Schema note: the pinned `@gadugi/agentic-test` CLI runner gates only on
  `run`-step exit codes and reads the command from `params.command`, so the whole
  suite runs under a single `bash -lc` wrapper that exits zero only when the
  gastronome asset test reports `test result: ok`. The suite is pure data + a
  Rust asset check, so it runs on any host with the toolchain — no external
  culinary tooling is required to exercise the identity end to end.
metadata:
  tags:
    - cli
    - gastronome
    - identity
    - example
agents:
  - name: cli-agent
    type: cli
    command: bash
steps:
  - action: run
    params:
      command: "bash -lc 'set -euo pipefail; cargo test --test gastronome_assets_valid 2>&1 | tee /tmp/gastronome-qa.log | grep -q \"test result: ok\"'"
    timeout: 600000
