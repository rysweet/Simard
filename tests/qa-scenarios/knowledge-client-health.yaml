name: simard-knowledge-bridge-health
app_type: cli
description: Verify native knowledge bridge starts and responds to health
steps:
  - action: run
    command: "cargo test -p simard launch_knowledge_bridge_native_succeeds --no-fail-fast -- --nocapture 2>&1 | tail -5"
    timeout: 120s
  - action: expect_stdout
    contains: 'ok'
