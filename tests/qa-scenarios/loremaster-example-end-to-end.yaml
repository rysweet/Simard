name: loremaster-example-end-to-end
app_type: cli
description: |
  Outside-in coverage for the EXAMPLE `loremaster` tabletop-RPG identity — the
  DATA-ONLY package under `examples/identities/loremaster/` (identity.toml +
  prompts/ + recipes/). It proves the shipped identity/prompt/recipe assets load
  and validate through the real Simard data-driven loader, and that the
  goal-session recipes carry the end-to-end campaign contract: world lore + NPCs
  + XP-budget-balanced encounters + session prep + a Foundry VTT module, then a
  session run end-to-end (initiative -> combat -> resolution, seeded dice) with
  the SRD-legal, XP-budget, and no-accidental-TPK invariants.

  This example adds ZERO Rust to `src/`: it is discovered by
  `load_example_identity`, never compiled into `BuiltinIdentityLoader`. There is
  no built-in `simard-loremaster` identity — the package is defined entirely by
  its data files. All rules content is open SRD (SRD 5.1, CC-BY 4.0 / OGL).

  Verified end to end by `tests/loremaster_example_assets_valid.rs`:
  - `examples/identities/loremaster/identity.toml` loads via
    `load_example_identity` as a curator, read-only, five-phase manifest;
  - every referenced prompt asset resolves to a real in-package file that treats
    inputs as untrusted data and constrains content to open SRD material;
  - both goal-session recipes run a combat encounter end-to-end (roll initiative
    -> resolve with seeded dice -> terminating outcome) and enforce the SRD-legal
    + XP-budget (encounter multiplier) + no-accidental-TPK invariants, covering
    world lore, NPCs, session prep, and a Foundry VTT module;
  - the package is data-only (contains no `.rs` files).

  Schema note: the pinned `@gadugi/agentic-test` CLI runner gates only on
  `run`-step exit codes and reads the command from `params.command`, so the whole
  suite runs under a single `bash -lc` wrapper that exits zero only when the
  `cargo test` run reports success.
metadata:
  tags:
    - cli
    - loremaster
    - ttrpg
    - dnd
    - example-identity
    - identity
agents:
  - name: cli-agent
    type: cli
    command: bash
steps:
  - action: run
    params:
      command: "bash -lc 'set -euo pipefail; cargo test --test loremaster_example_assets_valid 2>&1 | tee /tmp/loremaster-example-qa.log | grep -q \"test result: ok\"'"
    timeout: 600000
