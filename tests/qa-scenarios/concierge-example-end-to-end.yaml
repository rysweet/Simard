name: concierge-example-end-to-end
app_type: cli
description: |
  Outside-in coverage for the EXAMPLE `concierge` hospitality identity — the
  DATA-ONLY package under `examples/identities/concierge/` (identity.toml +
  prompts/ + recipes/). It proves the shipped identity/prompt/recipe assets load
  and validate through the real Simard data-driven loader, and that the
  goal-session recipes carry the end-to-end hospitality contract: property layout
  + guest-experience/brand design + reservations/PMS/housekeeping/channel-management
  workflows with the no-double-booking and availability-conservation invariants.

  This example is DISTINCT from Simard's own built-in `simard-concierge` identity
  (covered separately by `concierge-end-to-end.yaml`). It adds ZERO Rust to
  `src/`: it is discovered by `load_example_identity`, never compiled into
  `BuiltinIdentityLoader`.

  Verified end to end by `tests/concierge_example_assets_valid.rs`:
  - `examples/identities/concierge/identity.toml` loads via
    `load_example_identity` as a curator, read-only, five-phase manifest;
  - every referenced prompt asset resolves to a real in-package file that treats
    inputs as untrusted data;
  - both goal-session recipes drive the reservation lifecycle
    (book -> check-in -> check-out -> housekeeping -> restored availability) and
    enforce the no-double-booking invariant, covering property layout, brand
    design, and channel management;
  - the package is data-only (contains no `.rs` files).

  Schema note: the pinned `@gadugi/agentic-test` CLI runner gates only on
  `run`-step exit codes and reads the command from `params.command`, so the whole
  suite runs under a single `bash -lc` wrapper that exits zero only when the
  `cargo test` run reports success.
metadata:
  tags:
    - cli
    - concierge
    - hospitality
    - example-identity
    - identity
agents:
  - name: cli-agent
    type: cli
    command: bash
steps:
  - action: run
    params:
      command: "bash -lc 'set -euo pipefail; cargo test --test concierge_example_assets_valid 2>&1 | tee /tmp/concierge-example-qa.log | grep -q \"test result: ok\"'"
    timeout: 600000
