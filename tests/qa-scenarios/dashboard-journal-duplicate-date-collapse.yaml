# Canonical agentic-test schema (name + agents[] + steps[] with params),
# matching tests/qa-scenarios/dashboard-goal-persistence.yaml — the format the
# installed `gadugi-test` / `@gadugi/agentic-test` binary validates and runs via
# `ScenarioLoader` (requires `name`, a non-empty `agents` array, and `steps`).
#
# A single `cli` agent runs the hermetic regression script; the agent's command
# runner treats a non-zero exit code as a step failure, so the script's own
# `exit 1` on any lost same-day collapse makes this a real pass/fail gate, not a
# cosmetic assertion.
name: simard-dashboard-journal-duplicate-date-collapse
description: >-
  The dashboard Journal date picker and search collapse duplicate same-day
  journal facts to the single newest-generated entry — the day never appears
  twice with conflicting PR counts (dashboard bug: duplicate journal dates).
version: "1.0"
config:
  timeout: 600000
environment:
  requires: []
agents:
  - name: cli-agent
    type: cli
    config: {}
metadata:
  tags:
    - cli
    - dashboard
    - journal
  priority: high
steps:
  - name: Run the journal duplicate-date collapse regression script
    agent: cli-agent
    action: run
    params:
      command: bash
      args:
        - scripts/qa-journal-duplicate-date-collapse.sh
    timeout: 600000
