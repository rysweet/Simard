name: no-progress-evidence-invariant
app_type: cli
description: |
  Regression coverage for issue #16 (follow-up): the production
  `DeterministicNoProgressReasoner` must never return an empty-evidence WHY, so
  the no-progress breaker can never author a bare
  `🔒 [OODA-SAFEGUARD] … why=GENUINELY-STUCK evidence=[(none)]` block — the exact
  live-daemon defect that stranded the synthetic `simard-identity-*` /
  coverage / parity goals with a generic, evidence-free stamp.

  The classifier's terminal rung is split by whether the stalled goal still
  references any artifact the done-gate could ever verify:
  - a goal with NO tracked PR/issue has structurally unmeasurable done-criteria,
    so it classifies as `UNCLEAR-CRITERIA` with concrete evidence naming that
    missing criterion (never `(none)`);
  - a goal that still references open work stays `GENUINELY-STUCK` with those
    open artifacts as evidence;
  - an evidence-source probe error (`repo_present` / `dependency_goal_state`)
    fails closed to `GENUINELY-STUCK` but tags the errored probe so the WHY is
    still non-empty.

  Schema note: the pinned `@gadugi/agentic-test` CLI runner only gates on
  `run`-step exit codes and reads command text from `params.command`, so the
  four regression tests are run under a single `bash -lc` wrapper that exits
  zero only when all four report a passing "test result: ok" (`4 passed`).
metadata:
  tags:
    - cli
agents:
  - name: cli-agent
    type: cli
    command: bash
steps:
  - action: run
    params:
      command: "bash -lc 'set -euo pipefail; OUT=$(cargo test --lib -- ooda_loop::tests_no_progress_reasoner:: 2>&1); echo \"$OUT\"; echo \"$OUT\" | grep -q \"4 passed\"'"
    timeout: 300000
