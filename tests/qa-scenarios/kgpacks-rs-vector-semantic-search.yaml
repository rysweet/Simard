name: kgpacks-rs-vector-semantic-search
app_type: cli
description: |
  Outside-in proof for parity criterion **KGP-Q9** of the kgpacks-rs port
  (`Specs/agent-kgpacks-rs-parity.md`): the native knowledge handler answers a
  `knowledge.query` by **embedding-cosine vector retrieval** over the pack's
  stored article/section embeddings — the same retrieval *method* as the
  original agent-kgpacks (`Section.embedding` vector index) — rather than only a
  keyword LIKE scan.

  Per the operator directive (issue #4321, 2026-07-20) — "No keyword search is
  not good enough. It needs to be the same" — retrieval parity requires the
  original's GraphRAG method. A new `query_vector(conn, query_embedding, limit)`
  now runs BEFORE the keyword article fallback (order: graph -> vector ->
  keyword): it ranks the pack's stored `embedding` vectors (a JSON float array,
  the SQLite-port stand-in for upstream `DOUBLE[768]`) by `cosine_similarity` to
  the query embedding — the deterministic default `embed_text` (a normalized
  FNV-1a feature-hash, the port of upstream's default deterministic-hash
  embedder) — projecting the `url` for citations (KGP-Q1). Because it ranks by
  vector proximity, it retrieves an on-topic article that shares NO literal
  keyword with the question (which a LIKE scan misses). It returns `None` —
  falling back to the keyword scan, so keyword-only packs are unchanged — when
  the pack has no `embedding` column, the query carries no signal, or a stored
  vector's dimension does not match the query embedding.

  This scenario drives the hermetic, in-process `native_knowledge` unit tests
  that pin the corrected contract:
    - `query_vector_retrieves_semantically_near_article_without_keyword_overlap`
      — the decisive one: a near-embedding article with ZERO keyword overlap is
      retrieved by cosine where `query_articles` returns nothing;
    - `query_vector_ranks_by_cosine_descending` — cosine ranking is descending
      and drops orthogonal articles;
    - `query_vector_respects_limit` — the `limit` caps returned sources;
    - `query_vector_projects_url_citation_and_empty_url_is_no_citation` — the
      nearest article's url is cited; an empty url degrades to no citation;
    - `query_vector_returns_none_without_embedding_column` — keyword-only packs
      fall back unchanged;
    - `query_vector_returns_none_for_zero_query_and_dimension_mismatch` — no
      signal / mismatched dimension declines rather than mis-ranking;
    - `embed_text_is_deterministic_and_l2_normalized`,
      `cosine_similarity_handles_identity_orthogonal_and_mismatch`,
      `parse_embedding_reads_json_array_and_rejects_garbage` — the embedder,
      cosine, and parser primitives;
    - `native_knowledge_transport_query_uses_vector_search_when_embeddings_present`
      — the vector-ranked article appears first in the wire response end-to-end.
  The same run re-asserts the pre-existing KGP-Q1/Q4/Q5/Q8/T3 citation,
  parameterized-search, GraphRAG, ranking, and connection-reuse behaviour is
  unregressed. No network, no live host mutation. The CLI runner rejects any
  non-zero exit.
agents:
  - name: simard-cli
    type: cli
    command: cargo

steps:
  # The native knowledge query contract, including the new KGP-Q9 vector
  # semantic-search tests and the pre-existing citation / GraphRAG / ranking /
  # parameterized-search / connection-reuse behaviours.
  - action: run
    params:
      command: "cargo test --locked --lib native_knowledge"
    timeout: 600000
  - action: wait_for_output
    params:
      value: "test result: ok"
    timeout: 8000
  - action: validate_exit_code
    params:
      value: "0"
    timeout: 5000

  # Transport-level knowledge client suite proves the vector query path is
  # exercised end-to-end through the native RPC surface without regression.
  - action: run
    params:
      command: "cargo test --locked --lib knowledge_client"
    timeout: 600000
  - action: wait_for_output
    params:
      value: "test result: ok"
    timeout: 8000
  - action: validate_exit_code
    params:
      value: "0"
    timeout: 5000
