# Canonical agentic-test schema (name + agents[] + steps[] with params).
#
# The installed `gadugi-test` / `@gadugi/agentic-test` binary validates and runs
# scenarios through `ScenarioLoader` (canonical format), which requires a `name`,
# a `steps` array, and a non-empty `agents` array. A single `cli` agent runs the
# hermetic regression script; the agent's command runner treats a non-zero exit
# code as a step failure, so the script's own `exit 1` on a wrong count makes
# this a real pass/fail gate (not a cosmetic assertion).
name: simard-dashboard-memory-record-count
description: >-
  Standalone dashboard reports the real memory_records count from the
  checksummed on-disk envelope, never the object's key count (#4075).
version: "1.0"
config:
  timeout: 240000
environment:
  requires: []
agents:
  - name: cli-agent
    type: cli
    config: {}
metadata:
  tags:
    - cli
    - dashboard
    - memory
  priority: high
steps:
  - name: Run the standalone dashboard memory-record-count regression script
    agent: cli-agent
    action: run
    params:
      command: bash
      args:
        - scripts/qa-dashboard-memory-record-count.sh
    timeout: 240000
