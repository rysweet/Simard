name: ooda-no-progress-unclear-criteria-classification
app_type: cli
description: |
  Regression coverage for the live-daemon defect where an OODA goal with
  UNMEASURABLE done-criteria was parked / spawned with
  `why=GENUINELY-STUCK evidence=[(none)]`.

  Root cause: `DeterministicNoProgressReasoner::investigate` derived
  GENUINELY-STUCK evidence only from a goal's `wip_refs`, so a goal that never
  produced a tracked PR/issue (e.g. `advance-…-to-full-parity`, whose real
  cause is an unmeasurable "full parity" criterion) rendered an EMPTY evidence
  list — a generic, evidence-free block that stranded it forever.

  Fix, verified end to end:
  - A goal with NO derivable completion signal (no tracked PR/issue, not
    self-affecting) is now classified `UNCLEAR-CRITERIA` with the criteria
    named — routing it to a guided engineer whose task is to MAKE the
    done-criteria measurable — never `GENUINELY-STUCK`.
  - The `GENUINELY-STUCK` fall-through and its error-downgrade branches always
    carry non-empty evidence, so `evidence=[(none)]` can never again originate
    from the deterministic classifier.

  Schema note: the pinned `@gadugi/agentic-test` CLI runner gates on `run`-step
  exit codes and reads command text from `params.command`, so the four
  regression tests are run under a single `bash -lc` wrapper that exits zero
  only when all four report a passing "test result: ok" (4 passed).
metadata:
  tags:
    - cli
    - ooda
    - no-progress
agents:
  - name: cli-agent
    type: cli
    command: bash
steps:
  - action: run
    params:
      command: "bash -lc 'set -euo pipefail; OUT=$(cargo test --lib -- ooda_loop::tests_no_progress_reasoner::no_derivable_signal_classifies_unclear_criteria_with_nonempty_evidence ooda_loop::tests_no_progress_reasoner::genuinely_stuck_fallthrough_never_renders_empty_evidence ooda_loop::tests_no_progress_reasoner::open_pr_goal_is_genuinely_stuck_with_that_pr_as_evidence ooda_loop::tests_no_progress_reasoner::every_fallthrough_classification_carries_nonempty_evidence 2>&1); echo \"$OUT\"; echo \"$OUT\" | grep -q \"4 passed\"'"
    timeout: 300000
