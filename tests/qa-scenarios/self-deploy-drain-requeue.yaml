name: self-deploy-drain-requeue
app_type: cli
description: |
  Validates the redesigned self-deploy drain (fix: self-deploy so Simard can
  deploy her latest merged code even while busy running engineers):
  - The drain NEVER fails on a wall-clock timeout with engineers in flight.
  - The drain NEVER kills a producing engineer (worktree left intact).
  - drain_by_requeue marks draining and invokes requeue for every in-flight
    engineer, and never aborts when a single requeue fails.
  - The production requeue LEAVES a still-live engineer's claim sentinel intact
    (so a restarted binary does not duplicate a producing engineer's goal) and
    only releases a dead/missing claim.
  - draining.flag is reopened after a deploy: the new binary clears a stale
    flag at boot when no ExecHandover upgrade is in flight (and preserves it
    when one is), and any post-drain abort reopens dispatch before returning.
agents:
  - name: cargo-test-runner
    type: cli
    command: cargo

steps:
  # Drain never fails / never kills when an engineer is still in flight.
  - action: run
    command: "cargo test --lib -- --exact safe_update::drain::tests::drain_never_fails_with_a_fake_engineer_still_in_flight"
    timeout: 240s
  - action: expect_exit_code
    code: 0
  - action: expect_stdout
    contains: "test result: ok"

  # drain_by_requeue marks draining and invokes requeue for all in-flight engineers.
  - action: run
    command: "cargo test --lib -- --exact safe_update::drain::tests::drain_by_requeue_marks_draining_and_invokes_requeue_for_all"
    timeout: 240s
  - action: expect_exit_code
    code: 0
  - action: expect_stdout
    contains: "test result: ok"

  # A single requeue failure never aborts the deploy.
  - action: run
    command: "cargo test --lib -- --exact safe_update::drain::tests::drain_by_requeue_never_aborts_when_a_requeue_fails"
    timeout: 240s
  - action: expect_exit_code
    code: 0
  - action: expect_stdout
    contains: "test result: ok"

  # Production requeue LEAVES a live claim sentinel intact (no duplicate dispatch).
  - action: run
    command: "cargo test --lib -- --exact self_deploy::requeue::tests::requeue_leaves_live_claim_sentinel_without_touching_the_worktree"
    timeout: 240s
  - action: expect_exit_code
    code: 0
  - action: expect_stdout
    contains: "test result: ok"

  # Production requeue releases a DEAD claim sentinel so the goal can be picked up.
  - action: run
    command: "cargo test --lib -- --exact self_deploy::requeue::tests::requeue_releases_dead_claim_sentinel_without_touching_the_worktree"
    timeout: 240s
  - action: expect_exit_code
    code: 0
  - action: expect_stdout
    contains: "test result: ok"

  # Grace-only drain (download rail) also never fails and keeps the flag set.
  - action: run
    command: "cargo test --lib -- --exact safe_update::tests_orchestrator::drain_grace_never_fails_and_keeps_flag_in_place"
    timeout: 240s
  - action: expect_exit_code
    code: 0
  - action: expect_stdout
    contains: "test result: ok"

  # BLOCKER FIX: any post-drain abort reopens engineer dispatch before returning.
  - action: run
    command: "cargo test --lib -- --exact self_deploy::tests_orchestrator::failure_after_drain_reopens_dispatch_before_returning"
    timeout: 240s
  - action: expect_exit_code
    code: 0
  - action: expect_stdout
    contains: "test result: ok"

  # BLOCKER FIX: new binary clears a stale draining.flag at boot when no
  # ExecHandover upgrade is in flight (success/restart path reopens dispatch).
  - action: run
    command: "cargo test --lib -- --exact operator_commands_ooda::daemon::tests::boot_clear_removes_stale_draining_flag_without_exec_handover"
    timeout: 240s
  - action: expect_exit_code
    code: 0
  - action: expect_stdout
    contains: "test result: ok"

  # BLOCKER FIX guard: boot clear PRESERVES the flag during a legitimate
  # ExecHandover upgrade (must not clobber the classic safe-update rail).
  - action: run
    command: "cargo test --lib -- --exact operator_commands_ooda::daemon::tests::boot_clear_preserves_draining_flag_during_exec_handover"
    timeout: 240s
  - action: expect_exit_code
    code: 0
  - action: expect_stdout
    contains: "test result: ok"
