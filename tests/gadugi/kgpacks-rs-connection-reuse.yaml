name: "kgpacks-rs connection-reuse parity (KGP-T3)"
description: "Outside-in coverage for kgpacks-rs parity criterion KGP-T3: Simard's native Rust knowledge client (the agent-kgpacks port) must reuse one open read-only SQLite connection per pack across repeated knowledge.query calls instead of re-opening the database on every request. Proven via Arc::ptr_eq on the cached ConnCache handle and an end-to-end repeated-query RPC test. See Specs/agent-kgpacks-rs-parity.md."
version: "1.0.0"

config:
  timeout: 600000
  retries: 1
  parallel: false

environment:
  requires: []

agents:
  - name: "cli-agent"
    type: "cli"
    config:
      workingDirectory: "."
      defaultTimeout: 600000
      executionMode: "spawn"
      captureOutput: true
      ioConfig:
        encoding: "utf8"
        handleInteractivePrompts: false
      logConfig:
        logCommands: true
        logOutput: true
        logLevel: "info"

steps:
  - name: "native knowledge client reuses an open connection across queries"
    agent: "cli-agent"
    action: "execute_command"
    params:
      command: "tests/gadugi/kgpacks-rs-connection-reuse.sh"
    timeout: 600000

assertions: []

cleanup:
  - name: "CLI agent cleanup"
    agent: "cli-agent"
    action: "cleanup"

metadata:
  tags:
    - "cli"
    - "behavior"
    - "simard"
    - "kgpacks-rs"
    - "knowledge"
    - "parity"
    - "connection-reuse"
  priority: "high"
  author: "copilot"
  test_type: "outside-in"
