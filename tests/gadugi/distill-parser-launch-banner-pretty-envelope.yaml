name: "Distill Parser Recovers Facts AND Procedures From a Pretty Envelope Behind the Launch Banner"
description: >
  Outside-in regression gate for issue #2517 — the high-fidelity successor to
  the #2512 outer-envelope banner fix. In production recipe-runner-rs
  `--output-format json` emits a PRETTY-printed envelope (see
  `REAL_RUNNER_ENVELOPE_VERBATIM`), and the distill agent subprocess prints its
  own GitHub Copilot CLI `1.0.66-2` launch banner into the captured stdout that
  becomes the escaped `output` string of the `distill` step. The stdout also
  BEGINS WITH the outer launch banner (#2512), forcing Tier-1b recovery. There,
  the line-dropping `strip_recipe_noise` view drops the whole
  `"output": "...launching copilot binary=..."` line, leaving a
  structurally-valid but GUTTED envelope (`output` → null). The old first-match
  recovery committed to that gutted envelope, `extract_step_output` returned
  None, and the batch's facts AND procedures were silently swallowed with the
  recurring `distill failed (non-fatal): ... did not yield a parseable
  { "facts": [...] }` error — the #2512 compact-envelope test did not catch it
  because a compact one-line envelope is dropped wholesale and falls through to
  the line-preserving view.

  The fix (`recover_distill_output` + `candidate_runner_envelopes`) evaluates
  BOTH cleaned views and commits to the candidate that actually yields a
  populated `DistillOutput`, so the intact `strip_ansi` view wins over the
  gutted `strip_recipe_noise` view. This scenario pins the full ANSI-wrapped
  multi-line `1.0.66-2` banner + pretty envelope + inner-banner `output` shape
  end-to-end (facts AND procedures recovered), preserves the
  `success == false` -> RecipeReportedFailure contract, and keeps a genuinely
  empty "nothing to distill" answer an empty Ok (no burned retry) so the
  `distill_parse_success_rate` metric path stays green.
version: "1.0.0"

config:
  timeout: 600000
  retries: 1
  parallel: false

environment:
  requires: []

agents:
  - name: "test-agent"
    type: "cli"
    config:
      workingDirectory: "."
      defaultTimeout: 600000
      executionMode: "spawn"
      captureOutput: true
      ioConfig:
        encoding: "utf8"
        handleInteractivePrompts: false
      logConfig:
        logCommands: true
        logOutput: true
        logLevel: "info"

steps:
  - name: "Distill parser recovers facts AND procedures from a pretty envelope behind the launch banner (#2517)"
    agent: "test-agent"
    action: "execute_command"
    params:
      command: >
        cargo test --lib
        issue_2517_pretty_envelope_launch_banner_tests
        -- --nocapture
    timeout: 600000
    expect:
      exitCode: 0
      outputContains:
        - "full_1_0_66_2_launch_banner_with_ansi_and_envelope_recovers_facts_and_procedures ... ok"
        - "facts_only_wrapper_recovers_facts_from_pretty_envelope ... ok"
        - "line_dropping_view_alone_guts_the_pretty_envelope_output ... ok"
        - "banner_prefixed_failed_pretty_envelope_reports_recipe_failure ... ok"
        - "banner_prefixed_pretty_envelope_with_nothing_to_distill_returns_empty_ok ... ok"
        - "test result: ok"

  - name: "Full distillation parser contract still green (no regression)"
    agent: "test-agent"
    action: "execute_command"
    params:
      command: >
        cargo test --lib memory_consolidation::distillation
        -- --nocapture
    timeout: 600000
    expect:
      exitCode: 0
      outputContains:
        - "test result: ok"

assertions: []

cleanup:
  - name: "CLI agent cleanup"
    agent: "test-agent"
    action: "cleanup"

metadata:
  tags:
    - "cli"
    - "memory"
    - "distillation"
    - "regression"
    - "issue-2517"
  priority: "high"
  author: "copilot"
  test_type: "outside-in"
