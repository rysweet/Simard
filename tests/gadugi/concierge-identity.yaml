name: "Concierge Identity End-to-End (hospitality design + operations software)"
description: "Outside-in proof that the simard-concierge identity designs a hotel concept AND scaffolds a runnable reservations/PMS prototype end-to-end. Drives the operator-probe `concierge-run` surface (design -> scaffold -> book -> check-in -> check-out -> housekeeping -> restored availability, self-verified) and confirms the `simard-concierge` identity bootstraps as a first-class identity."
version: "1.0.0"

config:
  timeout: 360000
  retries: 1
  parallel: false

environment:
  requires: []

agents:
  - name: "cli-agent"
    type: "cli"
    config:
      workingDirectory: "."
      defaultTimeout: 360000
      executionMode: "spawn"
      captureOutput: true
      ioConfig:
        encoding: "utf8"
        handleInteractivePrompts: false
      logConfig:
        logCommands: true
        logOutput: true
        logLevel: "info"

steps:
  - name: "Concierge designs a hotel and verifies a runnable reservations/PMS prototype end-to-end"
    agent: "cli-agent"
    action: "execute_command"
    params:
      command: "tests/gadugi/concierge-identity.sh"
    timeout: 360000

assertions: []

cleanup:
  - name: "CLI agent cleanup"
    agent: "cli-agent"
    action: "cleanup"

metadata:
  tags:
    - "cli"
    - "behavior"
    - "simard"
    - "concierge"
    - "hospitality"
    - "identity"
    - "pms"
  priority: "high"
  author: "copilot"
  test_type: "outside-in"
