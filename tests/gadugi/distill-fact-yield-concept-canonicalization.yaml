name: distill-fact-yield-concept-canonicalization
app_type: cli
description: |
  qa-team outside-in gate for the perpetual-cognition sub-goals "distillation
  fact-yield" and "recall quality". The shared per-fact write-boundary gate
  `src/fact_reliability.rs::commit_gated_fact` — the single seam both the IPC
  `StoreFactGated` server path and the in-process distiller sink call — now folds
  a known concept's surface variant onto its canonical `KNOWN_CONCEPTS` label
  (`pr-pattern` / `bug-pattern` / `lesson-learned`) via `canonical_concept`
  BEFORE the concept is used as the dedup search key AND the stored concept.

  Two failure modes the old raw-concept path let through are now closed:

    * A genuinely-new fact committed under a separator/case variant label
      ("bug pattern", "Bug_Pattern") was stored under that raw variant. The
      backend's concept keyword search treats "bug-pattern" and "bug pattern" as
      different queries, so a concept-consistent recall for the canonical label
      MISSED the fact — a genuinely-recalled fact silently invisible to
      concept-keyed recall, dragging recall quality down. It is now stored under
      the canonical "bug-pattern" and surfaced by canonical-label recall.
    * A restatement of the SAME lesson under a variant concept label escaped
      identity-dedup and stored a redundant near-duplicate, inflating semantic
      memory and diluting recall precision. It now dedups against the canonical
      identity.

  A genuinely off-spec concept (one `canonical_concept` does not recognize) is
  preserved verbatim — canonicalization folds only the closed known label set,
  never rewrites an unrecognized concept. This is the concept-axis analog of the
  content-whitespace dedup (#4168) and episode-id grounding (#4212) fixes and
  changes NO honest same-label fact's disposition. Hermetic: no network, no live
  host mutation; the CLI runner rejects any non-zero exit.
agents:
  - name: simard-cli
    type: cli
    command: cargo

steps:
  # Headline: the write-boundary gate canonicalizes the concept for both the
  # stored concept (recall-consistency) and the dedup key (no redundant fact),
  # and preserves an off-spec concept verbatim.
  - action: run
    params:
      command: "cargo test --locked --lib fact_reliability_tests"
    timeout: 600000
  - action: wait_for_output
    params:
      value: "commit_gated_fact_canonicalizes_stored_concept ... ok"
    timeout: 8000
  - action: wait_for_output
    params:
      value: "commit_gated_fact_dedups_concept_surface_variant_restatement ... ok"
    timeout: 8000
  - action: wait_for_output
    params:
      value: "commit_gated_fact_preserves_offspec_concept_verbatim ... ok"
    timeout: 8000
  - action: wait_for_output
    params:
      value: "test result: ok"
    timeout: 8000
  - action: validate_exit_code
    params:
      value: "0"
    timeout: 5000

  # Regression guard: the full distillation semantic-handoff contract (the
  # write-boundary gate that consumes this canonicalization) stays green — no
  # honest same-label fact changes disposition.
  - action: run
    params:
      command: "cargo test --locked --lib memory_consolidation::distillation_semantic_handoff_tests"
    timeout: 600000
  - action: wait_for_output
    params:
      value: "test result: ok"
    timeout: 8000
  - action: validate_exit_code
    params:
      value: "0"
    timeout: 5000

metadata:
  tags:
    - cli
    - memory
    - cognitive-memory
    - distillation
    - fact-yield
    - recall
    - reliability
    - regression
  priority: high
  author: copilot
  test_type: outside-in
