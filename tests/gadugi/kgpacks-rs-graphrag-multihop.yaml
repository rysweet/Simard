name: "kgpacks-rs GraphRAG multi-hop parity (KGP-Q5)"
description: "Outside-in coverage for kgpacks-rs parity criterion KGP-Q5: Simard's native Rust knowledge client (the agent-kgpacks port) must answer knowledge.query by traversing the pack's knowledge graph (entities + relationships tables, multi-hop) instead of only running a single-table LIKE scan. Proven by surfacing a graph-linked entity the keyword never matched (hop 1) and a two-hop neighbour, with article-only packs falling back unchanged. See Specs/agent-kgpacks-rs-parity.md."
version: "1.0.0"

config:
  timeout: 600000
  retries: 1
  parallel: false

environment:
  requires: []

agents:
  - name: "cli-agent"
    type: "cli"
    config:
      workingDirectory: "."
      defaultTimeout: 600000
      executionMode: "spawn"
      captureOutput: true
      ioConfig:
        encoding: "utf8"
        handleInteractivePrompts: false
      logConfig:
        logCommands: true
        logOutput: true
        logLevel: "info"

steps:
  - name: "native knowledge client traverses entity+relationship graph (multi-hop)"
    agent: "cli-agent"
    action: "execute_command"
    params:
      command: "tests/gadugi/kgpacks-rs-graphrag-multihop.sh"
    timeout: 600000

assertions: []

cleanup:
  - name: "CLI agent cleanup"
    agent: "cli-agent"
    action: "cleanup"

metadata:
  tags:
    - "cli"
    - "behavior"
    - "simard"
    - "kgpacks-rs"
    - "knowledge"
    - "parity"
    - "graphrag"
    - "multi-hop"
  priority: "high"
  author: "copilot"
  test_type: "outside-in"
