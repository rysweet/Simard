name: "Brain reliability — distill parsing & distill_success_rate"
description: >
  Outside-in gate for issue #2461 (distill recipe failing non-fatally during
  consolidation, silently swallowed). Two regressions are pinned: (1) the
  tolerant parser now returns the *last* balanced facts object so a leading
  recipe banner no longer shadows the agent's answer (the t=7517 parse-failure
  mode), with string-aware brace scanning; and (2) every pass that runs the
  recipe records a `distill_success_rate` metric (value 1.0 on success / 0.0 on
  failure) whose context classifies the failure mode, so the previously-silent
  non-fatal failures become measurable from metrics.jsonl. Backing tests live in
  `src/memory_consolidation/distillation.rs` (unit_tests).
version: "1.0.0"

config:
  timeout: 300000
  retries: 1
  parallel: false

environment:
  requires: []

agents:
  - name: "test-agent"
    type: "cli"
    config:
      workingDirectory: "."
      defaultTimeout: 300000
      executionMode: "spawn"
      captureOutput: true
      ioConfig:
        encoding: "utf8"
        handleInteractivePrompts: false
      logConfig:
        logCommands: true
        logOutput: true
        logLevel: "info"

steps:
  - name: "#2461 — last-object-wins + string-aware parsing (banner no longer shadows facts)"
    agent: "test-agent"
    action: "execute_command"
    params:
      command: >
        cargo test --lib memory_consolidation::distillation::unit_tests::parse_recipe_output
        -- --nocapture --test-threads=1
    timeout: 300000
    expect:
      exitCode: 0
      outputContains:
        - "parse_recipe_output_prefers_last_facts_object_over_leading_banner ... ok"
        - "parse_recipe_output_tolerates_braces_inside_fact_content ... ok"
        - "parse_recipe_output_handles_unmatched_quote_in_leading_prose ... ok"
        - "test result: ok."

  - name: "#2461 — failure classification anchors on prefix (terminal vs parse)"
    agent: "test-agent"
    action: "execute_command"
    params:
      command: >
        cargo test --lib memory_consolidation::distillation::unit_tests::classify
        -- --nocapture --test-threads=1
    timeout: 300000
    expect:
      exitCode: 0
      outputContains:
        - "classify_distill_error_buckets_each_failure_mode ... ok"
        - "classify_anchors_on_prefix_not_embedded_stdout ... ok"
        - "test result: ok."

  - name: "#2461 — distill_success_rate metric context (success / parse-failure / terminal-failure)"
    agent: "test-agent"
    action: "execute_command"
    params:
      command: >
        cargo test --lib memory_consolidation::distillation::unit_tests::
        -- --nocapture --test-threads=1
    timeout: 300000
    expect:
      exitCode: 0
      outputContains:
        - "success_metric_context_marks_parse_attempted_and_parse_success ... ok"
        - "parse_failure_metric_context_attempted_parsing_but_failed ... ok"
        - "terminal_failure_metric_context_did_not_reach_parsing ... ok"
        - "test result: ok."

assertions: []

cleanup:
  - name: "Test agent cleanup"
    agent: "test-agent"
    action: "cleanup"

metadata:
  tags:
    - "cli"
    - "cognitive-memory"
    - "distillation"
    - "brain-reliability"
    - "metrics"
    - "regression"
    - "issue-2461"
  priority: "high"
  author: "copilot"
  test_type: "outside-in"
