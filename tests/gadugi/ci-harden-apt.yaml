name: "Flaky packages.microsoft.com apt source stays hardened"
description: "Outside-in verification of the CI-health fix for the intermittently-red default-branch verify jobs (issue #2975). GitHub runner images ship packages.microsoft.com apt sources that periodically serve an invalid InRelease (NOSPLIT / 'no longer signed'), so every apt-get update exits 100 and fails the job. scripts/ci-harden-apt.sh strips those Microsoft sources before any apt-get update. Asserts (no network): the script removes only Microsoft sources and is idempotent, both apt-consuming CI jobs wire it before apt-get, and the Rust regression guard passes."
version: "1.0.0"

config:
  timeout: 600000
  retries: 1
  parallel: false

environment:
  requires: []

agents:
  - name: "cli-agent"
    type: "cli"
    config:
      workingDirectory: "."
      defaultTimeout: 600000
      executionMode: "spawn"
      captureOutput: true
      ioConfig:
        encoding: "utf8"
        handleInteractivePrompts: false
      logConfig:
        logCommands: true
        logOutput: true
        logLevel: "info"

steps:
  - name: "ci-harden-apt strips only Microsoft sources, is idempotent, and stays wired"
    agent: "cli-agent"
    action: "execute_command"
    params:
      command: "tests/gadugi/ci-harden-apt.sh"
    timeout: 600000

assertions: []

cleanup:
  - name: "CLI agent cleanup"
    agent: "cli-agent"
    action: "cleanup"

metadata:
  tags:
    - "cli"
    - "ci-health"
    - "apt"
    - "flaky"
    - "guardrail"
    - "github-actions"
  priority: "high"
  author: "copilot"
  test_type: "outside-in"
