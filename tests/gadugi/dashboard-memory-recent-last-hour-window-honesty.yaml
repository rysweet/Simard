name: "Dashboard Memory Recent Last-Hour Window Honesty"
description: "Outside-in operator check (#4318) that the Resources → Memory headline caption never claims 'in the last hour' for a count that actually covers a longer window. The #mem-recent-count number is net long-term growth since a baseline snapshot; when memory_history.json has a gap wider than an hour straddling the 1h mark the baseline is arbitrarily older (e.g. 2.6h), so the count is net growth over 2.6h under a one-hour label. The fix surfaces last_hour_window_secs on /api/memory/recent and labels the caption from it (plain 'in the last hour' only within ±15min of 3600s, otherwise the true span). Boots the real dashboard binary, authenticates, and asserts both the live /api/memory/recent response shape and the served HTML renderer contract."
version: "1.0.0"

config:
  timeout: 300000
  retries: 0
  parallel: false

environment:
  requires: []

agents:
  - name: "cli-agent"
    type: "cli"
    config:
      workingDirectory: "."
      defaultTimeout: 300000
      executionMode: "spawn"
      captureOutput: true
      ioConfig:
        encoding: "utf8"
        handleInteractivePrompts: false
      logConfig:
        logCommands: true
        logOutput: true
        logLevel: "info"

steps:
  - name: "Last-hour caption honestly reflects the true covered window"
    agent: "cli-agent"
    action: "execute_command"
    params:
      command: "tests/gadugi/dashboard-memory-recent-last-hour-window-honesty.sh"
    timeout: 300000

assertions: []

cleanup:
  - name: "CLI agent cleanup"
    agent: "cli-agent"
    action: "cleanup"

metadata:
  tags:
    - "dashboard"
    - "memory"
    - "honesty"
    - "usability"
  priority: "high"
  author: "copilot"
  test_type: "outside-in"
