name: "Merge-Judge Record-Verdict Rework (#4721)"
description: "Outside-in proof that #4721 removed the forbidden JSON-emit->scrape->act pattern from the merge-judge: the merge-readiness recipe now RECORDS a typed verdict via the agent-facing `simard merge record-verdict` tool (act-via-tool, like distill-episodes.yaml) and prints no JSON envelope, while the thin deterministic rail READS the typed record and INDEPENDENTLY re-verifies the hard safety gates (mergeable, not draft, CI green, allow-listed base) before authorizing a merge. Validates the source contract, the in-tree store/rail/CLI decision-matrix tests (merge+red-CI => refused, merge+draft => refused, hold => not-ready, missing/stale record => unclear), and an end-to-end record-verdict write at the binary boundary."
version: "1.0.0"

config:
  timeout: 300000
  retries: 1
  parallel: false

environment:
  requires: []

agents:
  - name: "cli-agent"
    type: "cli"
    config:
      workingDirectory: "."
      defaultTimeout: 300000
      executionMode: "spawn"
      captureOutput: true
      ioConfig:
        encoding: "utf8"
        handleInteractivePrompts: false
      logConfig:
        logCommands: true
        logOutput: true
        logLevel: "info"

steps:
  - name: "Merge-judge record-verdict: act-via-tool contract + deterministic safety rail"
    agent: "cli-agent"
    action: "execute_command"
    params:
      command: "tests/gadugi/merge-judge-verdict.sh"
    timeout: 300000

assertions: []

cleanup:
  - name: "CLI agent cleanup"
    agent: "cli-agent"
    action: "cleanup"

metadata:
  tags:
    - "cli"
    - "behavior"
    - "simard"
    - "stewardship"
    - "merge-authority"
    - "recipe-brain"
    - "issue-4721"
    - "record-verdict"
    - "safety-rail"
  priority: "high"
  author: "copilot"
  test_type: "outside-in"
