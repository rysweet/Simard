name: "Merge-Judge Verdict Parse (#2428/#2430/#2435/#2462/#2463, #2501/#2555)"
description: "Outside-in proof that simard merge-pr's recipe-backed merge-readiness judge surfaces a real structured verdict from recipe-runner-rs JSON output instead of parsing the text-mode SUCCESS banner (which carries no verdict keyword and blocks every gated merge). Reproduces the text-mode banner bug and validates the json-mode fix at the recipe-runner boundary (no LLM), reproduces the real Copilot-launcher-preamble agent wire format from #2501/#2555, then runs the in-tree verdict-extraction + fail-closed unit tests."
version: "1.0.0"

config:
  timeout: 300000
  retries: 1
  parallel: false

environment:
  requires: []

agents:
  - name: "cli-agent"
    type: "cli"
    config:
      workingDirectory: "."
      defaultTimeout: 300000
      executionMode: "spawn"
      captureOutput: true
      ioConfig:
        encoding: "utf8"
        handleInteractivePrompts: false
      logConfig:
        logCommands: true
        logOutput: true
        logLevel: "info"

steps:
  - name: "Merge-judge verdict: text-mode banner bug vs json-mode fix + parse-composition/fail-closed"
    agent: "cli-agent"
    action: "execute_command"
    params:
      command: "tests/gadugi/merge-judge-verdict.sh"
    timeout: 300000

assertions: []

cleanup:
  - name: "CLI agent cleanup"
    agent: "cli-agent"
    action: "cleanup"

metadata:
  tags:
    - "cli"
    - "behavior"
    - "simard"
    - "stewardship"
    - "merge-authority"
    - "recipe-brain"
    - "issue-2428"
    - "issue-2462"
    - "issue-2463"
    - "issue-2501"
    - "issue-2555"
  priority: "high"
  author: "copilot"
  test_type: "outside-in"
