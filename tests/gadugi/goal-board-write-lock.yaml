name: "Goal-board cross-process write lock (#2511)"
description: "Outside-in coverage that sequential cross-process `simard goal add/remove` invocations accumulate and remove correctly without silent clobbering, and that the advisory goal-board write lock is engaged in the real (non-test) binary. Regression guard for issue #2511."
version: "1.0.0"

config:
  timeout: 300000
  retries: 1
  parallel: false

environment:
  requires: []

agents:
  - name: "cli-agent"
    type: "cli"
    config:
      workingDirectory: "."
      defaultTimeout: 300000
      executionMode: "spawn"
      captureOutput: true
      ioConfig:
        encoding: "utf8"
        handleInteractivePrompts: false
      logConfig:
        logCommands: true
        logOutput: true
        logLevel: "info"

steps:
  - name: "Goal-board cross-process add/remove round-trip"
    agent: "cli-agent"
    action: "execute_command"
    params:
      command: "tests/gadugi/goal-board-write-lock.sh"
    timeout: 300000

assertions: []

cleanup:
  - name: "CLI agent cleanup"
    agent: "cli-agent"
    action: "cleanup"

metadata:
  tags:
    - "cli"
    - "behavior"
    - "simard"
    - "goal-board"
    - "concurrency"
    - "regression"
  priority: "high"
  author: "copilot"
  test_type: "outside-in"
