name: "Decide + Orient Brain Typed-Record Seam (issue #4785, Group A)"
description: "Outside-in proof that the decide and orient RecipeBrain phases ACT through the gated `simard ooda record-decide|record-orient` tool + a fail-CLOSED typed-record reader (schemas simard.ooda.decide.v1 / simard.ooda.orient.v1), instead of scraping a JSON envelope / first action word (decide) or a bare urgency decimal off the banner timing (orient). Asserts the recipes call the record tool and scrape NOTHING from stdout, then runs the in-tree typed-record round-trip + R1–R8 fail-closed reader tests and the source/recipe rework contract."
version: "1.0.0"

config:
  timeout: 300000
  retries: 1
  parallel: false

environment:
  requires: []

agents:
  - name: "cli-agent"
    type: "cli"
    config:
      workingDirectory: "."
      defaultTimeout: 300000
      executionMode: "spawn"
      captureOutput: true
      ioConfig:
        encoding: "utf8"
        handleInteractivePrompts: false
      logConfig:
        logCommands: true
        logOutput: true
        logLevel: "info"

steps:
  - name: "Decide/orient brain typed-record seam: recipes act via record tool, fail-closed reader"
    agent: "cli-agent"
    action: "execute_command"
    params:
      command: "tests/gadugi/decide-orient-brain-parse.sh"
    timeout: 300000

assertions: []

cleanup:
  - name: "CLI agent cleanup"
    agent: "cli-agent"
    action: "cleanup"

metadata:
  tags:
    - "cli"
    - "behavior"
    - "simard"
    - "ooda"
    - "recipe-brain"
    - "decide"
    - "orient"
    - "issue-2421"
  priority: "high"
  author: "copilot"
  test_type: "outside-in"
