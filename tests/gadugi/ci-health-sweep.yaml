name: "CI-health governed-fleet sweep"
description: "End-to-end operator coverage for `simard ci-health`: the codified governed-fleet CI-health sweep. Verifies the sweep classifies workflow signals precisely — disabled workflows' stale failures, cancelled runs, and in-progress runs are ignored (never fail the fleet), while a genuine active-workflow failure IS flagged as actionable and drives a non-zero exit. Also verifies the opt-in `--file-issues` write (which files one deduplicated tracking issue per distinct actionable failure) is guarded off the offline fixture path — a live-only sweep — and advertised in help. Uses committed offline fixtures (no network) so the verdict is deterministic. Motivated by prior hand-rolled `gh run list` sweeps whose 'every workflow is success' claims were imprecise/reviewer-rejected because they could not distinguish a disabled-and-failing workflow from an active-and-failing one."
version: "1.0.0"

config:
  timeout: 300000
  retries: 1
  parallel: false

environment:
  requires: []

agents:
  - name: "cli-agent"
    type: "cli"
    config:
      workingDirectory: "."
      defaultTimeout: 300000
      executionMode: "spawn"
      captureOutput: true
      ioConfig:
        encoding: "utf8"
        handleInteractivePrompts: false
      logConfig:
        logCommands: true
        logOutput: true
        logLevel: "info"

steps:
  - name: "ci-health classifies disabled/cancelled/in-progress as ignored and active failure as actionable"
    agent: "cli-agent"
    action: "execute_command"
    params:
      command: "tests/gadugi/ci-health-sweep.sh"
    timeout: 300000

assertions: []

cleanup:
  - name: "CLI agent cleanup"
    agent: "cli-agent"
    action: "cleanup"

metadata:
  tags:
    - "cli"
    - "ci-health"
    - "stewardship"
    - "outside-in"
  priority: "high"
  author: "simard-engineer"
  test_type: "outside-in"
