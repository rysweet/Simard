name: "Dashboard Goals Tab Active Lifecycle Breakdown"
description: "Outside-in operator check that the Goals tab answers 'what is Simard actually working on right now?' instead of conflating in-flight work with finished-but-unarchived goals. On a live host, 9 of 20 'active' goals were `Completed`, yet the tab showed only 'N active goal(s)'. Boots the real dashboard binary, authenticates with the dashkey, and asserts BOTH that the served HTML wires in the `goalBreakdownText(d.active_status_breakdown)` helper on the active-count line AND that live `/api/goals` returns an additive `active_status_breakdown` object with a faithful per-GoalProgress-variant count (proposed, not_started, in_progress, blocked, paused, completed) whose buckets sum to `active_count`, with `active_count` preserved for back-compat."
version: "1.0.0"

config:
  timeout: 300000
  retries: 0
  parallel: false

environment:
  requires: []

agents:
  - name: "cli-agent"
    type: "cli"
    config:
      workingDirectory: "."
      defaultTimeout: 300000
      executionMode: "spawn"
      captureOutput: true
      ioConfig:
        encoding: "utf8"
        handleInteractivePrompts: false
      logConfig:
        logCommands: true
        logOutput: true
        logLevel: "info"

steps:
  - name: "Goals tab exposes and renders the active lifecycle breakdown"
    agent: "cli-agent"
    action: "execute_command"
    params:
      command: "tests/gadugi/dashboard-goals-active-breakdown.sh"
    timeout: 300000

assertions: []

cleanup:
  - name: "CLI agent cleanup"
    agent: "cli-agent"
    action: "cleanup"

metadata:
  tags:
    - "dashboard"
    - "usability"
    - "goals"
    - "self-serve-dashboard-improvement"
  priority: "high"
  author: "copilot"
  test_type: "outside-in"
