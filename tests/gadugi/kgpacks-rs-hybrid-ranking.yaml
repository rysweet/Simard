name: "kgpacks-rs hybrid ranking parity (KGP-Q10)"
description: "Outside-in coverage for kgpacks-rs parity criterion KGP-Q10: Simard's native Rust knowledge client (the agent-kgpacks port) must answer knowledge.query by BLENDING all three retrieval signals — multi-hop graph, vector-semantic cosine, and keyword coverage — into one fused ranking (weighted Reciprocal Rank Fusion) instead of selecting a single retrieval path. Proven by a shared fixture where a semantically-near article and a graph-linked entity (both with zero literal keyword overlap) outrank the highest-keyword-coverage item, while single-signal packs fuse one list and behave unchanged. This closes the last in-scope parity criterion. See Specs/agent-kgpacks-rs-parity.md."
version: "1.0.0"

config:
  timeout: 600000
  retries: 1
  parallel: false

environment:
  requires: []

agents:
  - name: "cli-agent"
    type: "cli"
    config:
      workingDirectory: "."
      defaultTimeout: 600000
      executionMode: "spawn"
      captureOutput: true
      ioConfig:
        encoding: "utf8"
        handleInteractivePrompts: false
      logConfig:
        logCommands: true
        logOutput: true
        logLevel: "info"

steps:
  - name: "native knowledge client blends graph + vector + keyword into one hybrid ranking"
    agent: "cli-agent"
    action: "execute_command"
    params:
      command: "tests/gadugi/kgpacks-rs-hybrid-ranking.sh"
    timeout: 600000

assertions: []

cleanup:
  - name: "CLI agent cleanup"
    agent: "cli-agent"
    action: "cleanup"

metadata:
  tags:
    - "cli"
    - "behavior"
    - "simard"
    - "kgpacks-rs"
    - "knowledge"
    - "parity"
    - "hybrid"
    - "ranking"
  priority: "high"
  author: "copilot"
  test_type: "outside-in"
