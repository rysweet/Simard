name: "kgpacks-rs hybrid ranking parity (KGP-Q10)"
description: "Outside-in coverage for kgpacks-rs parity criterion KGP-Q10: Simard's native Rust knowledge client (the agent-kgpacks port) must answer knowledge.query by blending the vector-semantic, graph, and keyword signals into one fused ranking (the original's ranker) instead of selecting a single retrieval path. Proven by ranking a multi-signal article above any single-signal one and a semantically-relevant article above one that only shares a literal keyword — an order no single signal produces. See Specs/agent-kgpacks-rs-parity.md."
version: "1.0.0"

config:
  timeout: 600000
  retries: 1
  parallel: false

environment:
  requires: []

agents:
  - name: "cli-agent"
    type: "cli"
    config:
      workingDirectory: "."
      defaultTimeout: 600000
      executionMode: "spawn"
      captureOutput: true
      ioConfig:
        encoding: "utf8"
        handleInteractivePrompts: false
      logConfig:
        logCommands: true
        logOutput: true
        logLevel: "info"

steps:
  - name: "native knowledge client fuses vector + graph + keyword signals (hybrid ranking)"
    agent: "cli-agent"
    action: "execute_command"
    params:
      command: "tests/gadugi/kgpacks-rs-hybrid-ranking.sh"
    timeout: 600000

assertions: []

cleanup:
  - name: "CLI agent cleanup"
    agent: "cli-agent"
    action: "cleanup"

metadata:
  tags:
    - "cli"
    - "behavior"
    - "simard"
    - "kgpacks-rs"
    - "knowledge"
    - "parity"
    - "hybrid"
    - "ranking"
  priority: "high"
  author: "copilot"
  test_type: "outside-in"
