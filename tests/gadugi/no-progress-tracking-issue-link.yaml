name: "OODA No-Progress Tracking-Issue Back-Link (UNCLEAR-CRITERIA done-gate fix)"
description: "Outside-in proof that when the no-progress breaker escalates a goal whose done-criteria reference no tracked PR/issue (why=UNCLEAR-CRITERIA), it LINKS the human-triage tracking issue it files back onto the goal — flipping the goal from structurally unmeasurable (has_derivable_signal false, done-gate blind) to a done-gate-verifiable artifact — and that a re-escalation is idempotent (no duplicate tracking ref, no ooda-stuck issue spam). Runs the in-tree unit/integration tests that pin the return type, the back-link, the dedupe guard, and the two end-to-end escalation outcomes."
version: "1.0.0"

config:
  timeout: 300000
  retries: 1
  parallel: false

environment:
  requires: []

agents:
  - name: "cli-agent"
    type: "cli"
    config:
      workingDirectory: "."
      defaultTimeout: 300000
      executionMode: "spawn"
      captureOutput: true
      ioConfig:
        encoding: "utf8"
        handleInteractivePrompts: false
      logConfig:
        logCommands: true
        logOutput: true
        logLevel: "info"

steps:
  - name: "No-progress tracking-issue back-link: return type + back-link + dedupe + escalation outcomes"
    agent: "cli-agent"
    action: "execute_command"
    params:
      command: "tests/gadugi/no-progress-tracking-issue-link.sh"
    timeout: 300000

assertions: []

cleanup:
  - name: "CLI agent cleanup"
    agent: "cli-agent"
    action: "cleanup"

metadata:
  tags:
    - "cli"
    - "behavior"
    - "simard"
    - "ooda"
    - "no-progress-breaker"
    - "unclear-criteria"
    - "tracking-issue-link"
  priority: "high"
  author: "copilot"
  test_type: "outside-in"
