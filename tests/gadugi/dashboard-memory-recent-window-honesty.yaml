name: "Dashboard Memory Recent-Window Honesty (#4318)"
description: "Outside-in operator check that the Memory tab labels the 'items remembered' number with the window it truly covers. When memory-history snapshots are sparse the trailing-hour baseline can be older than an hour, so last_hour_count spans >1h; the dashboard must surface last_hour_window_secs and only say 'in the last hour' when the window is genuinely ~1h. Boots the real dashboard binary, authenticates, and asserts both the live /api/memory/recent response shape and the served HTML renderer contract."
version: "1.0.0"

config:
  timeout: 300000
  retries: 0
  parallel: false

environment:
  requires: []

agents:
  - name: "cli-agent"
    type: "cli"
    config:
      workingDirectory: "."
      defaultTimeout: 300000
      executionMode: "spawn"
      captureOutput: true
      ioConfig:
        encoding: "utf8"
        handleInteractivePrompts: false
      logConfig:
        logCommands: true
        logOutput: true
        logLevel: "info"

steps:
  - name: "Memory recent panel exposes the true window and labels the count honestly"
    agent: "cli-agent"
    action: "execute_command"
    params:
      command: "tests/gadugi/dashboard-memory-recent-window-honesty.sh"
    timeout: 300000

assertions: []

cleanup:
  - name: "CLI agent cleanup"
    agent: "cli-agent"
    action: "cleanup"

metadata:
  tags:
    - "dashboard"
    - "memory"
    - "usability"
    - "issue-4318"
  priority: "high"
  author: "copilot"
  test_type: "outside-in"
