name: "Stale-PR triage runbook contract (#810)"
description: "Outside-in (TDD) verification that docs/howto/triage-stale-pull-requests.md encodes the ratified merge-gate behaviour and stays in sync with the live CI workflow check names. Pins the two architect corrections — accurate CI check-name classification (pre-commit/coverage/cargo-audit/install-real/e2e-dashboard from verify.yml + coverage.yml, plus the real `build` job from docs.yml that runs `mkdocs build --strict` on docs/Specs PRs; no invented `fmt` or `lbug-clippy` names and no denial of the real `build` check) and honest 'audited operator override' framing of the gh pr merge env-red path (never a tooling-sanctioned bypass) — plus durable doc hygiene: mkdocs nav registration, valid front-matter, real merge commands, the six merge-ready criteria, the evergreen no-snapshot invariant, and that every in-page anchor link resolves to a heading."
version: "1.0.0"

config:
  timeout: 120000
  retries: 1
  parallel: false

environment:
  requires: []

agents:
  - name: "cli-agent"
    type: "cli"
    config:
      workingDirectory: "."
      defaultTimeout: 120000
      executionMode: "spawn"
      captureOutput: true
      ioConfig:
        encoding: "utf8"
        handleInteractivePrompts: false
      logConfig:
        logCommands: true
        logOutput: true
        logLevel: "info"

steps:
  - name: "Stale-PR triage runbook matches the ratified gate behaviour and live CI"
    agent: "cli-agent"
    action: "execute_command"
    params:
      command: "tests/gadugi/triage-stale-pr-runbook.sh"
    timeout: 120000

assertions: []

cleanup:
  - name: "CLI agent cleanup"
    agent: "cli-agent"
    action: "cleanup"

metadata:
  tags:
    - "cli"
    - "docs"
    - "howto"
    - "stale-pr-triage"
    - "merge-gate"
    - "outside-in"
  priority: "high"
  author: "copilot"
  test_type: "outside-in"
  issue: "810"
