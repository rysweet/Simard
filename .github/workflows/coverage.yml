name: coverage

on:
  pull_request:
    paths:
      - "src/**"

permissions: {}

env:
  CARGO_BUILD_JOBS: 4
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_DEV_INCREMENTAL: "false"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_INCREMENTAL: "false"
  CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: "false"
  CARGO_PROFILE_TEST_BUILD_OVERRIDE_DEBUG: "false"

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare Rust runner (free disk, swap, mold)
        uses: ./.github/actions/rust-runner-prep

      - name: Install Rust nightly toolchain
        # SHA-pins the reachable `v1` release of dtolnay/rust-toolchain (an
        # ancestor of the action's default branch) and selects the channel via
        # the `toolchain:` input. A diverged per-channel branch HEAD ("# nightly")
        # breaks Dependabot's github_actions updater ("no such commit").
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly-2026-07-01
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        # SHA-pins the reachable `v2` release of taiki-e/install-action and
        # selects the tool via the `tool:` input. A diverged per-tool tag commit
        # breaks Dependabot's github_actions updater ("no such commit").
        uses: taiki-e/install-action@50414676f9f5d50a65992c6dd2ed02641263226c # v2.82.10
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: simard-coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          # Persist the stable lbug prebuilt outside the cargo registry/src tree
          # so the version-pinned download happens once per cache lifetime, the
          # same way verify.yml does (#2426 / #2423).
          cache-directories: |
            ~/.cache/simard-lbug-precommit

      - name: Provision lbug native static library link path (#2426 / #2423)
        # `cargo +nightly llvm-cov --workspace` runs a fresh build that compiles
        # lbug and hits the same evicted registry-src prebuilt as the pre-commit
        # clippy gate and verify.yml's install-real job: the cargo cache restores
        # around the registry archive but evicts it, while keeping the cached
        # build-script output that references it — so the link fails with "could
        # not find native static library `lbug`". Provision a stable copy, point
        # lbug at it via LBUG_LIBRARY_DIR/LBUG_INCLUDE_DIR, and drop the stale
        # cached lbug build outputs so the build script re-runs and adopts the
        # pinned path. Runs after the cache restore on purpose, before coverage.
        shell: bash
        run: |
          lib_dir="$HOME/.cache/simard-lbug-precommit/lib"
          scripts/provision-lbug-prebuilt.sh "$lib_dir" >/dev/null
          echo "LBUG_LIBRARY_DIR=$lib_dir" >> "$GITHUB_ENV"
          echo "LBUG_INCLUDE_DIR=$lib_dir" >> "$GITHUB_ENV"
          rm -rf target/*/build/lbug-* target/*/.fingerprint/lbug-* 2>/dev/null || true

      - name: Run coverage
        run: |
          mkdir -p target/ci-logs
          cargo +nightly-2026-07-01 llvm-cov --workspace --lib --bins \
            --ignore-filename-regex 'tests?/' \
            --json \
            --summary-only \
            --output-path target/ci-logs/coverage-summary.json

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci-logs/coverage-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Post coverage comment on PR
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            // Resilient, unit-tested comment poster (issue #4231): retries
            // transient GitHub 5xx/429/network errors and tolerates a persistent
            // outage so a failed comment post never fails the required coverage
            // check. See .github/scripts/coverage-comment.mjs (+ .test.mjs).
            const { postCoverageComment } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/coverage-comment.mjs`
            );
            const result = await postCoverageComment({
              github,
              context,
              fs: require('fs'),
              summaryPath: 'target/ci-logs/coverage-summary.json',
              log: { warn: core.warning, info: core.info },
            });
            if (!result.posted) {
              core.info(`Coverage comment not posted: ${result.reason}`);
            }
